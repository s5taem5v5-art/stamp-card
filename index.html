<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="スタンプカード">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>3人のスタンプカード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one person's card at a time on a twinkling deep-space backdrop; tabs on top, stamp grid, big glowing button. Single dark look by choice. */
:root{
  color-scheme:dark;
  --space:#0b0a24; --space2:#1a1048; --panel:rgba(24,18,66,.88); --ink:#f4f1ff; --muted:#b9b2e6; --line:rgba(185,178,230,.28);
  --p0:#ff4fb0; --p1:#38d6ff; --p2:#ffc93c; --p3:#8b6bff;
  --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:radial-gradient(120% 80% at 80% -10%,#3a1d7a 0,transparent 55%),radial-gradient(90% 60% at -10% 110%,#0f3a6b 0,transparent 60%),var(--space);
  color:var(--ink);font-family:var(--body);font-weight:500;font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:12px}
header .logo{width:52px;height:52px;flex:none;border-radius:50%;filter:drop-shadow(0 0 10px #ffbf7a)}
@keyframes spin{to{transform:rotate(360deg)}}
header h1{font-family:var(--display);font-weight:400;font-size:1.45rem;margin:0;line-height:1.2;
  background:linear-gradient(90deg,var(--p0),var(--p2),var(--p1));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:0;color:var(--muted);font-size:.82rem}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{font:inherit;font-weight:800;border:2px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:16px;padding:8px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;min-width:0;transition:transform .15s}
.tab img{width:34px;height:34px}
.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;font-size:.9rem}
.tab small{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.75rem}
.tab[aria-selected="true"]{border-color:transparent;background:linear-gradient(var(--space2),var(--space2)) padding-box,linear-gradient(120deg,#ff5fa2,#ffb84d,#fff36b,#6bffb0,#5fd8ff,#8b7bff,#ff6ff2) border-box;box-shadow:0 0 0 1px var(--pc),0 0 18px -2px var(--pc);transform:translateY(-2px)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--p2);outline-offset:2px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:18px 16px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 0 40px -18px var(--pc)}
.who{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.who h2{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0;min-width:0;overflow-wrap:anywhere}
.sndbtn{white-space:nowrap}
.edit-btn{font:inherit;font-size:.82rem;font-weight:800;background:rgba(255,255,255,.08);border:1.5px solid var(--line);color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer;flex:none}
.mission{border-radius:14px;padding:10px 12px;background:linear-gradient(135deg,color-mix(in srgb,var(--pc) 30%,transparent),rgba(255,255,255,.04));border:1px solid color-mix(in srgb,var(--pc) 60%,transparent)}
.mission .lbl{font-size:.7rem;letter-spacing:.16em;color:var(--pc);display:block;font-weight:800}
.mission b{font-size:1.08rem;overflow-wrap:anywhere}
.progress{display:flex;flex-direction:column;gap:6px}
.progress .nums{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
.progress strong{font-family:var(--display);font-weight:400;font-size:2rem;color:var(--pc);text-shadow:0 0 14px var(--pc)}
.progress .goal{color:var(--muted);font-size:.9rem}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ff5fa2,#ffb84d,#fff36b,#6bffb0,#5fd8ff,#8b7bff,#ff6ff2);background-size:200% 100%;animation:slide 3s linear infinite;box-shadow:0 0 10px var(--pc);transition:width .6s cubic-bezier(.2,1.2,.4,1)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.slot{aspect-ratio:1;max-width:100%;border-radius:50%;border:2px dashed var(--line);background:rgba(255,255,255,.03);
  display:grid;place-items:center;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;position:relative}
.slot.on{border:none;background:none;box-shadow:0 0 14px -1px var(--glow)}
.slot.on img{width:100%;height:100%;transform:rotate(var(--r,0deg))}
.slot .d{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:var(--space);color:var(--ink);font-size:.6rem;padding:0 5px;border-radius:6px;white-space:nowrap;border:1px solid var(--line)}
.slot.new img{animation:land .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes land{0%{transform:scale(2.6) rotate(-90deg);opacity:0}100%{transform:scale(1) rotate(var(--r));opacity:1}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 1.8s ease-in-out infinite}
.slot:nth-child(3n) .tw{animation-delay:-.6s}.slot:nth-child(3n+1) .tw{animation-delay:-1.2s}
@keyframes tw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.2;transform:scale(.4)}}
.slot .sh{position:absolute;inset:7%;border-radius:50%;overflow:hidden;pointer-events:none}
.slot .sh::before{content:"";position:absolute;top:-10%;bottom:-10%;left:0;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);
  transform:translateX(-120%) skewX(-18deg);animation:shine 3.4s ease-in-out infinite;will-change:transform}
.slot:nth-child(2n) .sh::before{animation-delay:-1.7s}
@keyframes shine{0%{transform:translateX(-120%) skewX(-18deg)}55%,100%{transform:translateX(300%) skewX(-18deg)}}
/* celebration overlay */
#party{position:fixed;inset:0;z-index:50;display:grid;place-items:center;cursor:pointer;
  background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--pc) 55%,transparent) 0,rgba(5,3,20,.88) 60%);
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);animation:fadein .2s}
#party canvas.fx{position:absolute;inset:0;width:100%;height:100%}
#party{overflow:hidden}
#party .flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,#fff 0,#fff 30%,color-mix(in srgb,var(--glow) 70%,#fff) 60%,transparent 100%);opacity:0;animation:flash .6s .6s ease-out both;pointer-events:none}
#party .galaxy{position:absolute;left:50%;top:42%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;pointer-events:none;will-change:transform;animation:spin 16s linear infinite,fadein 1s .5s both}
#party .rocket{position:absolute;left:0;top:0;width:56px;z-index:4;pointer-events:none;opacity:0;animation:fly 2.1s .9s cubic-bezier(.45,.05,.55,.95) both;will-change:transform}
#party .rocket svg{width:100%;display:block}
#party .rocket .flame{transform-origin:30px 92px;animation:flick .12s ease-in-out infinite alternate}
@keyframes flick{to{transform:scaleY(1.35) scaleX(.85)}}
@keyframes fly{0%{transform:translate(-80px,92vh) rotate(38deg);opacity:1}100%{transform:translate(105vw,-30vh) rotate(52deg);opacity:1}}
#party .hero{position:relative;z-index:2;width:100%;height:100%}
#party .orb{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;opacity:0;pointer-events:none;will-change:transform}
#party .orb>*{display:block;width:120%;height:120%;margin:-10%}
#party .orbitline{position:absolute;left:50%;top:50%;width:200%;transform:translate(-50%,-50%);z-index:1;overflow:visible;opacity:0;animation:fadein .6s .8s both}
#party .center{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:0 16px}
#party .big{width:min(62vw,300px);aspect-ratio:1;position:relative}
#party .hero>*{display:block;width:120%;height:120%;margin:-10%;will-change:transform;animation:slam .9s .55s cubic-bezier(.2,1.6,.35,1) both}
#party .rays{position:absolute;left:-45%;top:-45%;width:190%;height:190%;pointer-events:none;will-change:transform;animation:spin 6s linear infinite,fadein .6s .6s both}
#party .ring{position:absolute;left:50%;top:50%;width:100%;aspect-ratio:1;border-radius:50%;border:5px solid var(--glow);transform:translate(-50%,-50%) scale(.3);opacity:0;animation:wave 1.1s .6s ease-out forwards}
#party .ring:nth-of-type(2){animation-delay:.78s;border-color:#fff}
#party .ring:nth-of-type(3){animation-delay:.96s}
#party .t1{font-family:var(--display);font-size:clamp(1.8rem,9vw,2.8rem);line-height:1.1;color:#fff;text-shadow:0 0 12px var(--glow),0 0 30px var(--pc),0 4px 0 var(--p3);animation:pop .7s .85s cubic-bezier(.2,1.8,.4,1) both}
#party .t2{font-family:var(--display);font-size:1.25rem;background:linear-gradient(90deg,var(--p2),var(--p0),var(--p1),var(--p2));background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .7s 1.05s cubic-bezier(.2,1.8,.4,1) both,slide 1.5s linear infinite}
#party .t3{font-size:.8rem;color:var(--muted);animation:fadein .4s 1.4s both}
@keyframes flash{from{opacity:.95}to{opacity:0}}
@keyframes fadein{from{opacity:0}}
@keyframes slam{0%{transform:scale(4) rotate(-200deg);opacity:0}55%{transform:scale(.85) rotate(10deg);opacity:1}75%{transform:scale(1.12) rotate(-4deg)}100%{transform:scale(1) rotate(0)}}
@keyframes wave{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(-50%,-50%) scale(2.6);opacity:0}}
@keyframes pop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes slide{to{background-position:-200% 0}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,3px)}}

.month{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mbtn{font:inherit;font-family:var(--display);font-size:1.6rem;line-height:1;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);cursor:pointer;flex:none}
.mbtn:disabled{opacity:.25;cursor:default}
.mtitle{display:flex;align-items:baseline;gap:8px;justify-content:center;min-width:0}
.mtitle small{color:var(--muted);font-variant-numeric:tabular-nums}
.mtitle b{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1;background:linear-gradient(90deg,#ff5fa2,#fff36b,#5fd8ff,#b98bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.mtitle b span{font-size:1.1rem}
.mtitle em{font-style:normal;font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--pc);color:#1a0b2e}
.notice{font:inherit;display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;color:var(--ink);font-weight:800;font-size:.9rem;
  padding:10px 12px;border-radius:14px;border:2px solid transparent;
  background:linear-gradient(var(--space2),var(--space2)) padding-box,linear-gradient(120deg,#ff5fa2,#ffb84d,#fff36b,#6bffb0,#5fd8ff,#8b7bff) border-box}
.notice span:nth-child(2){flex:1;min-width:0}
.notice b{font-size:.8rem;padding:3px 12px;border-radius:99px;background:var(--p2);color:#2b1433}
.notice .dot{width:10px;height:10px;border-radius:50%;background:#ff5fa2;box-shadow:0 0 0 0 #ff5fa2;animation:ping 1.6s infinite;flex:none}
@keyframes ping{70%{box-shadow:0 0 0 10px rgba(255,95,162,0)}100%{box-shadow:0 0 0 0 rgba(255,95,162,0)}}
.progress .of{font-size:.95rem;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;font-size:.7rem;font-weight:800;color:var(--muted)}
.cal .wd.sun{color:#ff8ab8}.cal .wd.sat{color:#7fd0ff}
.cal .slot{font-size:.74rem;border-width:1.5px}
.cal .slot.future{opacity:.38}
.cal .slot.today{border:2px solid var(--p2);color:var(--ink);font-weight:800;box-shadow:0 0 12px -2px var(--p2)}
.cal .slot.on.today{border:none}
.cal .slot .d{font-size:.56rem;bottom:-5px;padding:0 4px}
.result{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px}
.result .ico{width:64px;height:64px;flex:none}
.result .ico svg,.result .ico img{width:100%;height:100%}
.result b{display:block;font-family:var(--display);font-weight:400;font-size:1.25rem}
.result span{color:var(--muted);font-size:.85rem}
.result.win{background:linear-gradient(135deg,rgba(255,210,74,.22),rgba(255,95,162,.14));border:1px solid rgba(255,210,74,.6)}
.result.win b{color:#ffd24a}
.result.lose{background:rgba(188,180,255,.10);border:1px solid rgba(188,180,255,.4)}
.press.replay{font-size:1rem;padding:14px}
/* month result overlay */
#party.res.win{background:radial-gradient(circle at 50% 42%,rgba(255,200,60,.45) 0,rgba(5,3,20,.9) 62%)}
#party.res.lose{background:radial-gradient(circle at 50% 42%,rgba(140,120,255,.35) 0,rgba(5,3,20,.9) 62%)}
#party.res .flash{animation:none;opacity:0}
#party.res.go.win .flash{animation:flash .7s ease-out both}
#party.res .r-head{display:flex;flex-direction:column;align-items:center;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
#party.res .r-head small{color:var(--muted);font-weight:800}
#party.res .r-head b{font-family:var(--display);font-weight:400;font-size:1.5rem;color:#fff}
#party.res .meter{position:relative;width:min(64vw,270px);aspect-ratio:1}
#party.res .meter svg{width:100%;height:100%;display:block;overflow:visible}
#party.res .meter .arc{filter:drop-shadow(0 0 6px rgba(255,255,255,.5))}
#party.res .count{position:absolute;inset:0;display:flex;align-items:baseline;justify-content:center;padding-top:36%;gap:4px;transition:transform .5s cubic-bezier(.2,1.4,.4,1),opacity .4s}
#party.res .count b{font-family:var(--display);font-weight:400;font-size:clamp(3rem,16vw,4.4rem);line-height:1;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 0 18px var(--glow)}
#party.res .count span{color:var(--muted);font-size:1.2rem;font-weight:800}
#party.res .trophy,#party.res .moonie{position:absolute;left:18%;top:14%;width:64%;height:72%;opacity:0;pointer-events:none}
#party.res .trophy svg{width:100%;height:100%;filter:drop-shadow(0 0 22px #ffd24a)}
#party.res .moonie>*{width:100%;height:auto;display:block}
#party.res.go.win .count{transform:translateY(-62%) scale(.55);opacity:.0}
#party.res.go.win .trophy{opacity:1;animation:slam .9s cubic-bezier(.2,1.6,.35,1) both}
#party.res.go.lose .meter{animation:wobble .6s ease-in-out}
#party.res.go.lose .count{transform:translateY(-58%) scale(.6);opacity:.0}
#party.res.go.lose .moonie{animation:moonIn 1s cubic-bezier(.3,1.4,.5,1) both,bob 2.6s 1s ease-in-out infinite}
@keyframes wobble{20%{transform:rotate(-6deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
@keyframes moonIn{0%{opacity:0;transform:translateY(60%) scale(.4) rotate(-30deg)}100%{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-7%) rotate(4deg)}}
#party.res .t1,#party.res .t2{animation:none;opacity:0}
#party.res.go .t1{animation:pop .7s .25s cubic-bezier(.2,1.8,.4,1) both}
#party.res.go .t2{animation:pop .7s .45s cubic-bezier(.2,1.8,.4,1) both,slide 1.5s linear infinite}
#party.res.lose .t2{background:none;color:#d8d2ff;-webkit-background-clip:border-box;background-clip:border-box}
#party.res .t3{animation:fadein .4s 2.4s both}

.mebar{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:6px;margin-top:-6px}
.mechip{font:inherit;font-weight:800;font-size:.82rem;display:flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:99px;cursor:pointer;color:var(--ink);
  border:1.5px solid var(--line);background:rgba(255,255,255,.06)}
.mechip img{width:26px;height:26px}
.mechip.ask{padding:7px 14px;border:2px solid transparent;background:linear-gradient(var(--space2),var(--space2)) padding-box,linear-gradient(120deg,#ff5fa2,#fff36b,#5fd8ff,#b98bff) border-box;animation:pulse2 1.8s ease-in-out infinite}
@keyframes pulse2{50%{box-shadow:0 0 16px -2px #ff5fa2}}
.reward{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;border:2px solid transparent;
  background:linear-gradient(rgba(30,18,70,.96),rgba(30,18,70,.96)) padding-box,linear-gradient(120deg,#ff5fa2,#ffb84d,#fff36b,#6bffb0,#5fd8ff,#8b7bff,#ff6ff2) border-box}
.rw-head{display:flex;align-items:center;gap:8px}
.rw-head .gift{width:28px;height:28px;flex:none;animation:gift 2.4s ease-in-out infinite}
.rw-head .gift svg{width:100%;height:100%}
@keyframes gift{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-12deg) scale(1.1)}82%{transform:rotate(10deg) scale(1.1)}88%{transform:rotate(-6deg)}}
.rw-head .lbl{font-size:.72rem;letter-spacing:.14em;font-weight:800;color:#ffb8e2;flex:1}
.rw-head em{font-style:normal;font-size:.75rem;font-weight:800;padding:2px 10px;border-radius:99px}
.rw-head em.got{background:#ffd24a;color:#2b1433}.rw-head em.miss{background:rgba(255,255,255,.12);color:var(--muted)}
.rw-body b{display:block;font-size:1.1rem;overflow-wrap:anywhere}
.rw-body b.none{color:var(--muted);font-weight:500;font-size:.95rem}
.rw-body small{color:var(--muted);font-size:.75rem}
.rw-btn{font:inherit;font-weight:800;font-size:.9rem;padding:10px;border-radius:12px;cursor:pointer;border:none;color:#2b1433;background:linear-gradient(110deg,#ffd24a,#ff8ad0)}
.rw-note{margin:0;font-size:.78rem;color:var(--muted)}
.rw-form{display:flex;flex-direction:column;gap:10px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(5,3,20,.7);display:flex;align-items:flex-end;justify-content:center;
  padding:0 max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));animation:fadein .2s}
.sheet .panel{width:100%;max-width:520px;background:var(--space2);border:2px solid var(--line);border-radius:22px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;animation:up .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .panel>b{font-family:var(--display);font-weight:400;font-size:1.2rem}
.sheet .panel p{margin:0;color:var(--muted);font-size:.85rem}
.who3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.whob{font:inherit;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:16px;cursor:pointer;color:var(--ink);border:2px solid var(--line);background:rgba(255,255,255,.05);min-width:0}
.whob img{width:52px;height:52px}
.whob span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whob small{font-size:.62rem;color:var(--muted);font-weight:500;text-align:center}
.whob[aria-pressed="true"]{border-color:var(--pc);box-shadow:0 0 14px -2px var(--pc)}
.whob:disabled{opacity:.45;cursor:default}
.sheet .close{font:inherit;font-weight:800;padding:12px;border-radius:12px;border:2px solid var(--line);background:none;color:var(--ink);cursor:pointer}
#party.res .t4{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1rem;color:#fff;padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.1);max-width:100%;opacity:0}
#party.res .t4 svg{width:28px;height:28px;flex:none}
#party.res .t4 span{overflow-wrap:anywhere}
#party.res.go .t4{animation:pop .7s .7s cubic-bezier(.2,1.8,.4,1) both}
.nokey{display:flex;flex-direction:column;gap:6px;text-align:center;padding:30px 10px}.nokey b{font-family:var(--display);font-weight:400;font-size:1.2rem}.nokey span{color:var(--muted)}

.rewards{display:flex;flex-direction:column;gap:10px}
.reward.mid{background:linear-gradient(rgba(30,18,70,.96),rgba(30,18,70,.96)) padding-box,linear-gradient(120deg,#c8d2ff,#8fd8ff,#e6c8ff) border-box}
.reward.mid .lbl{color:#bfe6ff}
.bar{position:relative;overflow:visible}
.bar i{position:relative;z-index:1}
.bar .flag{position:absolute;top:-4px;width:4px;height:18px;margin-left:-2px;border-radius:2px;background:rgba(255,255,255,.35);z-index:2}
.bar .flag.on{background:#fff;box-shadow:0 0 8px #bfe6ff}
.flaglbl{font-size:.66rem;color:#bfe6ff;font-weight:800;margin-top:-2px}
#party.res.mid .trophy svg{filter:grayscale(1) brightness(1.35) drop-shadow(0 0 22px #bfe6ff)}
#party.res.mid.win{background:radial-gradient(circle at 50% 42%,rgba(150,200,255,.4) 0,rgba(5,3,20,.9) 62%)}
.spark{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:var(--c);pointer-events:none;animation:fly .7s ease-out forwards}
@keyframes fly{from{transform:translate(-50%,-50%);opacity:1}to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.3);opacity:0}}
.press{font:inherit;font-family:var(--display);font-size:1.15rem;border:none;border-radius:18px;padding:17px 12px;cursor:pointer;color:#fff;
  background:linear-gradient(110deg,#ff5fa2,#ffb84d,#f5e15a,#5fe8a8,#5fd8ff,#8b7bff,#ff6ff2,#ff5fa2);background-size:300% 100%;
  text-shadow:0 1px 0 rgba(60,0,80,.55),0 0 10px rgba(80,0,120,.45);
  box-shadow:0 5px 0 color-mix(in srgb,var(--p3) 55%,#000),0 0 26px -4px var(--pc);
  animation:pulse 2.4s ease-in-out infinite,slide 4s linear infinite}
@keyframes pulse{50%{box-shadow:0 5px 0 color-mix(in srgb,var(--p3) 55%,#000),0 0 36px 2px var(--pc)}}
.press:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--p3) 55%,#000)}
.press:disabled{background:rgba(255,255,255,.08);color:var(--muted);box-shadow:none;cursor:default;transform:none;animation:none}
.sub{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.link{font:inherit;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
.done-msg{text-align:center;font-family:var(--display);font-size:1.2rem;background:linear-gradient(90deg,var(--p2),var(--p0),var(--p1));-webkit-background-clip:text;background-clip:text;color:transparent}
form{display:flex;flex-direction:column;gap:14px}
label,.fl{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:800}
input,select{font:inherit;font-weight:500;font-size:16px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:rgba(0,0,0,.3);color:var(--ink);width:100%}
.picks{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pick{font:inherit;font-size:.72rem;font-weight:800;border:2px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);border-radius:14px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.pick img{width:100%;max-width:44px;aspect-ratio:1}
.pick[aria-pressed="true"]{border-color:var(--p2);box-shadow:0 0 14px -2px var(--p2);background:rgba(255,201,60,.12)}
.swatches{display:flex;gap:10px}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer;background:var(--c)}
.sw[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 12px var(--c)}
.actions{display:flex;gap:10px}
.actions button{flex:1;font:inherit;font-weight:800;padding:12px;border-radius:12px;cursor:pointer;border:2px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink)}
.actions .save{background:linear-gradient(135deg,var(--pc),var(--p3));border-color:transparent;color:#fff}
.danger{font:inherit;font-size:.82rem;background:none;border:none;color:#ff8a9a;text-decoration:underline;cursor:pointer;align-self:flex-start;padding:0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem}
.confirm button{font:inherit;font-size:.85rem;padding:6px 12px;border-radius:10px;border:1.5px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);cursor:pointer}
.confirm .yes{border-color:#ff8a9a;color:#ff8a9a}
.note{font-size:.76rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<canvas id="sky"></canvas>
<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true" id="logo"></svg>
    <div><h1>3人のスタンプカード</h1><p id="today"></p></div>

<script>
/* ---------- stamp art: realistic bodies with cute faces, seen through a porthole; small SMIL motions inside ---------- */
const INK="#2b1433";

function eyes(cx,cy,gap,r,begin){ const ry=(r*1.18).toFixed(2);
  const one=x=>`<g><ellipse cx="${x}" cy="${cy}" rx="${r}" ry="${ry}" fill="${INK}"><animate attributeName="ry" values="${ry};${ry};.3;${ry}" keyTimes="0;.9;.95;1" dur="4.2s" begin="${begin}" repeatCount="indefinite"/></ellipse>
    <g fill="#fff"><animate attributeName="opacity" values="1;1;0;1" keyTimes="0;.9;.95;1" dur="4.2s" begin="${begin}" repeatCount="indefinite"/>
    <circle cx="${(x-r*.32).toFixed(2)}" cy="${(cy-r*.42).toFixed(2)}" r="${(r*.42).toFixed(2)}"/><circle cx="${(x+r*.35).toFixed(2)}" cy="${(cy+r*.35).toFixed(2)}" r="${(r*.18).toFixed(2)}"/></g></g>`;
  return one(cx-gap/2)+one(cx+gap/2); }
const blush=(cx,cy,gap,c="#ff6f9f")=>`<g fill="${c}" opacity=".62" filter="url(#bl)"><ellipse cx="${cx-gap/2}" cy="${cy}" rx="3.4" ry="2"/><ellipse cx="${cx+gap/2}" cy="${cy}" rx="3.4" ry="2"/></g>`;
const smile=(cx,cy,w)=>`<path d="M${cx-w} ${cy} Q${cx} ${cy+w*1.1} ${cx+w} ${cy}" fill="none" stroke="${INK}" stroke-width="1.7" stroke-linecap="round"/>`;
const openSmile=(cx,cy,w)=>`<path d="M${cx-w} ${cy} Q${cx} ${cy+w*1.6} ${cx+w} ${cy} Z" fill="${INK}"/><path d="M${cx-w*.5} ${cy+w*.75} Q${cx} ${cy+w*.4} ${cx+w*.5} ${cy+w*.75} Q${cx} ${cy+w*1.15} ${cx-w*.5} ${cy+w*.75}Z" fill="#ff6f8f"/>`;
const tw=(x,y,s,dur,begin,c="#fff")=>`<path d="M${x} ${y-s} Q${x} ${y} ${x+s} ${y} Q${x} ${y} ${x} ${y+s} Q${x} ${y} ${x-s} ${y} Q${x} ${y} ${x} ${y-s}Z" fill="${c}"><animate attributeName="opacity" values="0;1;0" dur="${dur}s" begin="${begin}s" repeatCount="indefinite"/></path>`;

const STAMPS = {
  earth:{label:"地球", glow:"#5fd0ff", rim:["#9ff0ff","#2a7bd6"], neb:["#123a6e","#06122e"], art:`
    <defs>

      <filter id="b2"><feGaussianBlur stdDeviation="1.8"/></filter><filter id="b1"><feGaussianBlur stdDeviation="1"/></filter>

    </defs>
    <circle cx="50" cy="50" r="34" fill="#5fd0ff" opacity=".5" filter="url(#b2)"><animate attributeName="opacity" values=".35;.7;.35" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="50" cy="50" r="30" fill="url(#oc)"/>

        ${[0,64].map(o=>`<ellipse cx="${o+28}" cy="30" rx="9" ry="2.6"/><ellipse cx="${o+52}" cy="40" rx="7" ry="2"/><ellipse cx="${o+38}" cy="70" rx="10" ry="2.4"/><ellipse cx="${o+66}" cy="62" rx="6" ry="2"/><ellipse cx="${o+18}" cy="56" rx="5" ry="1.6"/>`).join("")}</g></g></g>

    <ellipse cx="39" cy="36" rx="9" ry="4.5" fill="#fff" opacity=".25" transform="rotate(-32 39 36)" filter="url(#b2)"/>
    <path id="orbE" d="M8 58 A42 13 -12 1 1 92 40 A42 13 -12 1 1 8 58" fill="none"/>

      <rect x="-1.6" y="-1.2" width="3.2" height="2.4" rx=".5" fill="#ffe36b"/><rect x="-6" y="-.8" width="3.6" height="1.6" fill="#6fb8ff"/><rect x="2.4" y="-.8" width="3.6" height="1.6" fill="#6fb8ff"/>

    ${blush(50,57,24,"#ff8fb8")}
    <ellipse cx="50" cy="60" rx="2" ry="1.6" fill="${INK}"><animate attributeName="ry" values="1.2;2.1;1.2" dur="3s" repeatCount="indefinite"/></ellipse>
    <g fill="#bcb4ff" font-family="Arial Rounded MT Bold,Arial,sans-serif" font-weight="700">
      ${[0,1,2].map(i=>`<text x="70" y="34" font-size="${6+i*1.5}" opacity="0">Z<animate attributeName="opacity" values="0;1;0" dur="3s" begin="${i}s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;8 -16" dur="3s" begin="${i}s" repeatCount="indefinite"/></text>`).join("")}</g>
    ${tw(22,26,3,2.2,0,"#fff7c2")}${tw(80,78,2.4,2.8,1)}`},
  sun:{label:"太陽", glow:"#ff9a2e", rim:["#ffe27a","#e8561e"], neb:["#5a1238","#1a0618"], art:`
    <defs>
      <radialGradient id="co" cx=".5" cy=".5" r=".5"><stop offset=".48" stop-color="#ffd86a"/><stop offset=".64" stop-color="#ff8a2a" stop-opacity=".6"/><stop offset="1" stop-color="#ff2d55" stop-opacity="0"/></radialGradient>

    ${eyes(50,47,12,2.6,"1.3s")}${blush(50,54,20,"#ff4f7a")}${openSmile(50,54,4.2)}

  planet:{label:"惑星", glow:"#ffbf7a", rim:["#ffe3a8","#b26a3c"], neb:["#3d1a5e","#120720"], art:`

      <g fill="none" clip-path="url(#front)"><ellipse cx="50" cy="50" rx="40" ry="10.5" stroke="url(#rg)" stroke-width="2.6" opacity=".8"/><ellipse cx="50" cy="50" rx="34.5" ry="9" stroke="url(#rg)" stroke-width="4.5"/><ellipse cx="50" cy="50" rx="28" ry="7.3" stroke="#d6a77a" stroke-width="2.2" opacity=".85"/></g>
      <path id="orbP" d="M10 50 A40 10.5 0 1 0 90 50 A40 10.5 0 1 0 10 50" fill="none"/>
      <circle r="2.3" fill="#cfe9ff"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#orbP"/></animateMotion></circle>
      <circle r="1.2" fill="#fff"><animateMotion dur="5s" begin="-2.5s" repeatCount="indefinite"><mpath href="#orbP"/></animateMotion><animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/></circle>
    </g>`},
  star:{label:"星", glow:"#c8b4ff", rim:["#ffd6f6","#7a5cff"], neb:["#3b1460","#0c0624"], art:`
    <defs>
      <radialGradient id="hl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff"/><stop offset=".22" stop-color="#fff3d6"/><stop offset=".38" stop-color="#ffc0ea" stop-opacity=".7"/><stop offset="1" stop-color="#6a4cff" stop-opacity="0"/></radialGradient>

      <linearGradient id="sp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>

      <filter id="neb3" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="4" seed="9"/>
        <feColorMatrix values="0 0 0 0 .35  0 0 0 0 .7  0 0 0 0 1  2.4 0 0 0 -1.1"/></filter>

    <circle cx="50" cy="50" r="32" fill="url(#hl)"><animate attributeName="r" values="29;35;29" dur="2.2s" repeatCount="indefinite"/></circle>

    <div class="center">
      <div class="r-head"><small>${p.name}</small><b>${mid?"おりかえし地点":round+"まいめの カード"}</b></div>
      <div class="meter">

      </div>

    </div>`;
  { const rw=rewards[rKey(Object.keys(people).find(k=>people[k]===p)||current,round,mid)]; const t4=o.querySelector(".t4");
    if(rw){ t4.innerHTML=GIFT; const s=document.createElement("span"); s.textContent = (mid?"中間ごほうび「":"ごほうび「")+rw.text+"」ゲット！"; t4.append(s); } else t4.remove(); }
  o.querySelector(".moonie").append(stampPic("moon"));
  o.querySelector(".t1").textContent = mid ? "中間ゴール！" : "コンプリート！！";
  o.querySelector(".t2").textContent = mid ? `${got}こ たまった！ あと${goal-got}こ` : `${goal}こ 集めた！`;
  document.body.append(o); window.__party=true;
  setTimeout(()=>{ if(window.__party) document.querySelector(".wrap").style.visibility="hidden"; },300);

  const arc=o.querySelector(".arc"), cnt=o.querySelector("#cnt");
  const t0=performance.now(), FILL=1700, REVEAL=FILL+300;
  let raf=0, revealed=false;
  const c=o.querySelector("canvas.fx"), x=c.getContext("2d"), r=Math.min(devicePixelRatio||1,1.5), W=innerWidth, H=innerHeight;
  c.width=Math.round(W*r); c.height=Math.round(H*r); x.setTransform(r,0,0,r,0,0); x.lineCap="round";
  const cols=["#ff5fa2","#ffb84d","#fff36b","#6bffb0","#5fd8ff","#8b7bff","#ff6ff2","#ffffff"];
  const bits=[], rockets=[];
  const starPath=new Path2D(); for(let q=0;q<10;q++){ const rr=q%2?.42:1, aa=q/10*Math.PI*2-Math.PI/2; starPath[q?"lineTo":"moveTo"](Math.cos(aa)*rr,Math.sin(aa)*rr); } starPath.closePath();
  const boom=(bx,by,n,pow)=>{ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=2+Math.random()*pow;
    bits.push({x:bx,y:by,vx:Math.cos(a)*v,vy:Math.sin(a)*v,s:2.5+Math.random()*5,rot:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[i%cols.length],k:i%2,life:0,g:.12}); } };
  const launch=()=>rockets.push({x:W*(.15+Math.random()*.7),y:H+10,vy:-(11+Math.random()*4),ty:H*(.12+Math.random()*.3),c:cols[Math.floor(Math.random()*7)]});
  const drizzle=()=>bits.push({x:Math.random()*W,y:-10,vx:(Math.random()-.5)*.6,vy:1+Math.random()*1.2,s:2+Math.random()*3,rot:0,vr:.02,c:"#bcb4ff",k:0,life:0,g:0,slow:1});
  let lastF=t0, lastLaunch=0, closed=false;
  (function f(t){ const e=t-t0, dt=Math.min(2.5,(t-lastF)/16.67); lastF=t;
    const k=Math.min(1,e/FILL), ease=1-Math.pow(1-k,3), shown=ratio*ease;
    arc.setAttribute("stroke-dashoffset", (C*(1-shown)).toFixed(1));
    cnt.textContent = String(Math.round(got*ease));
    if(e>REVEAL && !revealed){ revealed=true; o.classList.add("go");
      try{ navigator.vibrate && navigator.vibrate(win?[40,40,40,40,160]:[120]); }catch(err){}
      try{ SFX.result(mid); }catch(err){}
      if(win && !still){ boom(W/2,H*.4,140,9); for(let i=0;i<3;i++) launch(); } }
    if(!still){
      x.setTransform(r,0,0,r,0,0); x.clearRect(0,0,W,H);
      if(revealed && win && e-lastLaunch>420 && e<REVEAL+3600){ lastLaunch=e; launch(); }
      if(revealed && !win && Math.random()<.25*dt) drizzle();
      for(let i=rockets.length-1;i>=0;i--){ const m=rockets[i]; m.y+=m.vy*dt; m.vy*=Math.pow(.985,dt);
        x.globalAlpha=1; x.strokeStyle=m.c; x.lineWidth=3; x.beginPath(); x.moveTo(m.x,m.y); x.lineTo(m.x,m.y+22); x.stroke();
        if(m.y<=m.ty){ rockets.splice(i,1); boom(m.x,m.y,70,6); } }
      for(let i=bits.length-1;i>=0;i--){ const b=bits[i]; b.vy+=b.g*dt; if(!b.slow){ b.vx*=Math.pow(.98,dt); b.vy*=Math.pow(.99,dt); }
        b.x+=b.vx*dt; b.y+=b.vy*dt; b.rot+=b.vr*dt; b.life+=dt;
        const al=b.slow?Math.min(1,1.4-b.y/H):1-b.life/110; if(al<=0||b.y>H+20){ bits.splice(i,1); continue; }
        x.globalAlpha=al; x.fillStyle=b.c; const co=Math.cos(b.rot)*b.s, si=Math.sin(b.rot)*b.s; x.setTransform(co*r,si*r,-si*r,co*r,b.x*r,b.y*r);
        if(b.k===0) x.fill(starPath); else { x.beginPath(); x.arc(0,0,.5,0,6.28); x.fill(); } }
      x.setTransform(r,0,0,r,0,0); x.globalAlpha=1;
    }
    if(e<REVEAL+5000 && !closed) raf=requestAnimationFrame(f); })(t0);
  const close=()=>{ if(closed) return; closed=true; cancelAnimationFrame(raf); window.__party=false;
    document.querySelector(".wrap").style.visibility=""; o.style.transition="opacity .3s"; o.style.opacity="0";
    setTimeout(()=>{ o.remove(); after(); },300); };
  o.onclick=()=>{ if(performance.now()-t0>600) close(); };
}

/* Pre-rendered bitmaps: stamps are drawn once into canvases so the celebration moves flat pictures (cheap) instead of re-running SVG filters every frame. */
const STAMP_BMP = {};
function prerenderStamps(){
  STAMP_KEYS.forEach(k=>{ if(STAMP_BMP[k]) return; const im=new Image(); im.decoding="async";
    im.onload=()=>{ const S=360, c=document.createElement("canvas"); c.width=c.height=S; const x=c.getContext("2d");
      x.shadowColor=STAMPS[k].glow; x.shadowBlur=26; x.drawImage(im,30,30,S-60,S-60); x.shadowBlur=0; x.drawImage(im,30,30,S-60,S-60); STAMP_BMP[k]=c; };
    im.src=stampURL(k); });
}
function stampPic(k){ const m=STAMP_BMP[k]; if(!m) return Object.assign(document.createElement("div"),{innerHTML:stampSVG(k)}).firstChild;
  const c=document.createElement("canvas"); c.width=m.width; c.height=m.height; c.getContext("2d").drawImage(m,0,0); return c; }
let GALAXY=null, RAYS=null;
function wheel(size, draw){ const c=document.createElement("canvas"); c.width=c.height=size; const x=c.getContext("2d"), h=size/2; draw(x,h);
  x.globalCompositeOperation="destination-in"; const g=x.createRadialGradient(h,h,0,h,h,h); g.addColorStop(0,"#000"); g.addColorStop(.25,"rgba(0,0,0,.9)"); g.addColorStop(.6,"rgba(0,0,0,.35)"); g.addColorStop(1,"rgba(0,0,0,0)");
  x.fillStyle=g; x.fillRect(0,0,size,size); return c; }
function prerenderWheels(){
  if(!GALAXY) GALAXY=wheel(640,(x,h)=>{ const N=90; for(let i=0;i<N;i++){ const a0=i/N*Math.PI*2, a1=(i+1.08)/N*Math.PI*2;
      x.fillStyle=`hsla(${(i/N*360+300)%360},95%,68%,${.18+.22*Math.max(0,Math.sin(i/N*Math.PI*6))})`; x.beginPath(); x.moveTo(h,h); x.arc(h,h,h,a0,a1); x.fill(); }
    for(let i=0;i<12;i++){ const a=i/12*Math.PI*2; x.fillStyle="rgba(255,255,255,.10)"; x.beginPath(); x.moveTo(h,h); x.arc(h,h,h,a,a+.07); x.fill(); } });
  if(!RAYS) RAYS=wheel(420,(x,h)=>{ for(let i=0;i<16;i++){ const a=i/16*Math.PI*2; x.fillStyle="rgba(255,255,255,.55)"; x.beginPath(); x.moveTo(h,h); x.arc(h,h,h,a,a+Math.PI*2/16*.42); x.fill(); } });
}
function copyCanvas(src,cls){ const c=document.createElement("canvas"); c.width=src.width; c.height=src.height; c.getContext("2d").drawImage(src,0,0); c.className=cls; return c; }

let partyOpen=false;
/* ---------- pachinko-style sound (Web Audio, synthesized) ---------- */
const SFX = (()=>{
  let ctx=null, out=null, comp=null, on=true;
  try{ on = localStorage.getItem("snd")!=="0"; }catch(e){}
  const N = n => 440*Math.pow(2,(n-69)/12);           // midi -> Hz
  function init(){
    if(!ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
      try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
      ctx=new AC();
      comp=ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=6; comp.connect(ctx.destination);
      out=ctx.createGain(); out.gain.value=.55; out.connect(comp);
      // little shimmer echo
      const dl=ctx.createDelay(); dl.delayTime.value=.11; const fb=ctx.createGain(); fb.gain.value=.28; const wet=ctx.createGain(); wet.gain.value=.22;
      out.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(comp);
    }
    if(ctx.state!=="running") ctx.resume();
    return ctx;
  }
  function tone(f,t,d,type="square",v=.2,f2=null,att=.004){
    const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+att); g.gain.exponentialRampToValueAtTime(.0008,t+d);
    o.connect(g); g.connect(out); o.start(t); o.stop(t+d+.05); return o;
  }
  let nbuf=null;
  function noise(t,d,v=.3,from=6000,to=300){
    if(!nbuf){ nbuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate); const a=nbuf.getChannelData(0); for(let i=0;i<a.length;i++) a[i]=Math.random()*2-1; }
    const s=ctx.createBufferSource(); s.buffer=nbuf; const fl=ctx.createBiquadFilter(); fl.type="lowpass";
    fl.frequency.setValueAtTime(from,t); fl.frequency.exponentialRampToValueAtTime(to,t+d);
    const g=ctx.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    s.connect(fl); fl.connect(g); g.connect(out); s.start(t); s.stop(t+d+.05);
  }
  // キュイーン：detuned squares sweeping up with fast vibrato
  function kyuin(t,d=.62){
    const lfo=ctx.createOscillator(), lg=ctx.createGain(); lfo.frequency.value=22; lg.gain.value=60; lfo.connect(lg);
    [0,7].forEach(det=>{ const o=tone(260,t,d,"square",.07,2600,.08); o.detune.value=det*3; lg.connect(o.frequency); });
    lfo.start(t); lfo.stop(t+d+.05);
    // rising arpeggio sparkles
    const sc=[72,74,76,79,81,84,86,88,91,93,96,98];
    sc.forEach((n,i)=>tone(N(n),t+i*d/sc.length,.09,"triangle",.09));
  }
  // バーン！：impact + bright chord stab
  function bang(t,big){
    noise(t,big?.9:.6,.3,9000,200);
    tone(160,t,.45,"sine",.45,38,.002);
    [72,76,79,84,88].forEach(n=>{ tone(N(n),t,big?1.3:.9,"sawtooth",.05); tone(N(n)*1.005,t,big?1.3:.9,"square",.03); });
  }
  // ジャラジャラ：pachinko-ball / coin payout cascade
  function payout(t,len,dense){
    const bells=[96,98,100,103,105,108];
    const n=Math.round(len*(dense?34:24));
    for(let i=0;i<n;i++){ const tt=t+i*len/n+Math.random()*.02, f=N(bells[Math.floor(Math.random()*bells.length)])*(1+Math.random()*.012);
      tone(f,tt,.07+Math.random()*.06,"triangle",.1+Math.random()*.06);
      if(i%3===0) tone(f*1.5,tt+.01,.05,"sine",.04); }
  }
  // パラララッパー：fanfare
  function fanfare(t,big){
    const seq= big
      ? [[67,.09],[72,.09],[76,.09],[79,.18],[76,.09],[79,.5],[0,.06],[81,.09],[84,.09],[88,.7]]
      : [[72,.08],[76,.08],[79,.08],[84,.42]];
    let tt=t; seq.forEach(([n,d])=>{ if(n){ tone(N(n),tt,d+.18,"square",.13); tone(N(n+12),tt,d+.12,"triangle",.07); } tt+=d; });
    // sustaining chord under the last note
    const last=big?[72,76,79,84]:[60,67,72,76]; last.forEach(n=>tone(N(n),tt-(big?.7:.42),big?1.4:.9,"sawtooth",.035,null,.03));
    return tt;
  }
  return {
    get on(){ return on; },
    toggle(){ on=!on; try{ localStorage.setItem("snd",on?"1":"0"); }catch(e){} if(on) init(); },
    unlock(){ if(on) init(); },
    core(){ return init() ? {ctx, comp, N} : null; },
    ping(){ if(!init()) return; const t=ctx.currentTime+.02; tone(N(96),t,.12,"triangle",.12); tone(N(100),t+.07,.18,"triangle",.12); },
    stamp(goalHit, midHit){
      if(!on || !init()) return; const t=ctx.currentTime+.03;
      try{ BGM.duck(goalHit?5.2:(midHit?3.6:2.8)); }catch(e){}
      kyuin(t);
      bang(t+.65, goalHit||midHit);
      payout(t+.72, goalHit?2.6:(midHit?2.0:1.4), goalHit||midHit);
      fanfare(t+.9, goalHit||midHit);
      if(goalHit){ kyuin(t+1.6,.4); bang(t+2.0,true); payout(t+2.1,1.8,true); fanfare(t+2.3,true); }
    },
    result(mid){
      if(!on || !init()) return; const t=ctx.currentTime+.03;
      try{ BGM.duck(3.2); }catch(e){}
      bang(t+.1,true); fanfare(t+.25,true); payout(t+.3, mid?1.6:2.4, true);
    }
  };
})();

/* ---------- looping BGM: upbeat chiptune on the 王道進行 (IV-V-iii-vi) ---------- */
const BGM = (()=>{
  let on=true, playing=false, timer=null, bus=null, ctx=null, N=null, step=0, nextT=0, nbuf=null;
  try{ on = localStorage.getItem("bgm")!=="0"; }catch(e){}
  const BPM=148, S=60/BPM/4, VOL=.2, BARS=8;
  // chord per bar: [bass root, triad]
  const CH={F:[41,[65,69,72]],G:[43,[67,71,74]],Em:[40,[64,67,71]],Am:[45,[69,72,76]],C:[48,[67,72,76]]};
  const PROG=["F","G","Em","Am","F","G","C","C"];
  const MEL=[ // [step-in-bar, midi, length-in-steps]
    [[0,76,2],[2,79,2],[4,81,4],[8,84,2],[10,81,2],[12,79,4]],
    [[0,79,2],[2,81,2],[4,83,4],[8,86,4],[12,83,4]],
    [[0,83,2],[2,84,2],[4,83,2],[6,79,2],[8,76,4],[12,79,4]],
    [[0,81,6],[6,79,2],[8,76,2],[10,79,2],[12,81,4]],
    [[0,76,2],[2,79,2],[4,81,4],[8,84,2],[10,81,2],[12,79,4]],
    [[0,79,2],[2,81,2],[4,83,2],[6,86,2],[8,88,4],[12,86,4]],
    [[0,88,4],[4,86,2],[6,84,2],[8,84,8]],
    [[0,79,1],[1,81,1],[2,83,1],[3,84,1],[4,86,1],[5,88,1],[6,91,2],[8,88,1],[9,91,1],[10,93,1],[11,96,1],[12,91,4]]
  ];
  function osc(type,f,t,d,v,att=.005,rel=null){
    const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+att);
    if(rel) g.gain.setValueAtTime(v,t+d-rel);
    g.gain.exponentialRampToValueAtTime(.0005,t+d); o.connect(g); g.connect(bus); o.start(t); o.stop(t+d+.03); return o;
  }
  function hit(t,d,v,type,freq){
    if(!nbuf){ nbuf=ctx.createBuffer(1,ctx.sampleRate*.5,ctx.sampleRate); const a=nbuf.getChannelData(0); for(let i=0;i<a.length;i++) a[i]=Math.random()*2-1; }
    const s=ctx.createBufferSource(); s.buffer=nbuf; const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq;
    const g=ctx.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    s.connect(f); f.connect(g); g.connect(bus); s.start(t); s.stop(t+d+.02);
  }
  function kick(t){ const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(42,t+.12);
    g.gain.setValueAtTime(.9,t); g.gain.exponentialRampToValueAtTime(.001,t+.22); o.connect(g); g.connect(bus); o.start(t); o.stop(t+.25); }
  function schedStep(i,t){
    const bar=Math.floor(i/16)%BARS, s=i%16, [root,tri]=CH[PROG[bar]], last=bar===BARS-1;
    // drums: four-on-the-floor, clap on 2&4, offbeat hats, snare roll into the loop point
    if(s%4===0) kick(t);
    if(s===4||s===12) hit(t,.14,.35,"bandpass",1800);
    if(s%4===2) hit(t,.05,.22,"highpass",8000);
    if(s%2===1) hit(t,.025,.08,"highpass",9000);
    if(last && s>=12) hit(t,.08,.18+(s-12)*.05,"bandpass",2200);
    // bass: octave pump on 8ths
    if(s%2===0) osc("sawtooth", N(root+(s%4===2?12:0)), t, S*1.8, .22, .004);
    // arp: 16th notes up through the chord, two octaves
    const ar=[tri[0],tri[1],tri[2],tri[0]+12,tri[1]+12,tri[2]+12,tri[0]+12,tri[2]];
    osc("triangle", N(ar[s%8]+12), t, S*.9, .07, .003);
    // pad stab on the beat after each bar line
    if(s===0) tri.forEach(n=>osc("sawtooth",N(n),t,S*14,.025,.06,S*4));
    // lead
    for(const [p,n,l] of MEL[bar]) if(p===s){ const o=osc("square",N(n),t,S*l*.95,.09,.006,S*.5);
      if(l>=4){ const lf=ctx.createOscillator(), lg=ctx.createGain(); lf.frequency.value=6; lg.gain.value=N(n)*.012; lf.connect(lg); lg.connect(o.frequency); lf.start(t+S*2); lf.stop(t+S*l); }
      osc("triangle",N(n+12),t,S*l*.6,.03,.006); }
  }
  function tick(){
    if(!playing) return;
    while(nextT < ctx.currentTime+.18){ schedStep(step,nextT); step=(step+1)%(16*BARS); nextT+=S; }
  }
  function start(){
    if(playing || !on) return;
    const c=SFX.core(); if(!c) return; ctx=c.ctx; N=c.N;
    if(!bus){ bus=ctx.createGain(); bus.gain.value=VOL; bus.connect(c.comp); }
    bus.gain.cancelScheduledValues(ctx.currentTime); bus.gain.setValueAtTime(0,ctx.currentTime); bus.gain.linearRampToValueAtTime(VOL,ctx.currentTime+.6);
    playing=true; step=0; nextT=ctx.currentTime+.08; tick(); timer=setInterval(tick,30);
  }
  function stop(){
    if(!playing) return; playing=false; clearInterval(timer); timer=null;
    if(bus){ const t=ctx.currentTime; bus.gain.cancelScheduledValues(t); bus.gain.setValueAtTime(bus.gain.value,t); bus.gain.linearRampToValueAtTime(0,t+.3); }
  }
  // start on the first touch (browsers block sound until the user interacts)
  const kick0=()=>{ if(on && !playing && document.visibilityState==="visible") start(); };
  addEventListener("pointerdown",kick0,{passive:true}); addEventListener("keydown",kick0);
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="hidden"){ const was=playing; stop(); BGM._resume=was; }
    else if(BGM._resume && on){ start(); } });
  return {
    get on(){ return on; }, get playing(){ return playing; },
    toggle(){ on=!on; try{ localStorage.setItem("bgm",on?"1":"0"); }catch(e){} on?start():stop(); },
    duck(sec){ if(!playing||!bus) return; const t=ctx.currentTime; bus.gain.cancelScheduledValues(t);
      bus.gain.setValueAtTime(bus.gain.value,t); bus.gain.linearRampToValueAtTime(VOL*.15,t+.08);
      bus.gain.setValueAtTime(VOL*.15,t+sec); bus.gain.linearRampToValueAtTime(VOL,t+sec+1.2); },
    _resume:false
  };
})();

function party(p, after){
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const _ri=roundInfo(p), mgoal=_ri.goal, goalHit=_ri.inRound===0&&_ri.done>0, count=goalHit?mgoal:_ri.inRound;
  const glow = STAMPS[p.stamp].glow;
  prerenderWheels();
  const o=document.createElement("div"); o.id="party";
  o.style.setProperty("--pc",`var(${COLORS[p.color]})`); o.style.setProperty("--glow",glow);
  o.innerHTML=`<canvas class="fx"></canvas><div class="flash"></div>
    <div class="rocket">${ROCKET}</div>
    <div class="center"><div class="big">
      <svg class="orbitline" viewBox="-100 -40 200 80" aria-hidden="true"><defs><linearGradient id="orbG" x1="0" x2="1"><stop offset="0" stop-color="#ff5fa2"/><stop offset=".3" stop-color="#fff36b"/><stop offset=".6" stop-color="#5fd8ff"/><stop offset="1" stop-color="#b98bff"/></linearGradient></defs>
        <ellipse rx="64" ry="19.2" fill="none" stroke="url(#orbG)" stroke-width="1.6" stroke-dasharray="3 4" opacity=".9"/>
        <ellipse rx="54" ry="16" fill="none" stroke="url(#orbG)" stroke-width="1" opacity=".55"/></svg>
      <i class="ring"></i><i class="ring"></i><i class="ring"></i>
      <div class="hero"></div>
    </div>
    <div class="t1"></div><div class="t2"></div><div class="t3">タップで閉じる</div></div>`;
  o.prepend(copyCanvas(GALAXY,"galaxy"));
  o.querySelector(".big").prepend(copyCanvas(RAYS,"rays"));
  o.querySelector(".hero").append(stampPic(p.stamp));
  const big=o.querySelector(".big");
  const orbs=STAMP_KEYS.filter(k=>k!==p.stamp).map(k=>{ const d=document.createElement("div"); d.className="orb"; d.append(stampPic(k)); big.append(d); return d; });
  o.querySelector(".t1").textContent = goalHit ? "ゴール達成！！" : (_ri.mid && count===_ri.mid ? "おりかえし！" : CHEERS[Math.floor(Math.random()*CHEERS.length)]);
  o.querySelector(".t2").textContent = goalHit ? `${mgoal}こ コンプリート！` : `${count}こめ GET！ あと${mgoal-count}こ`;
  document.body.append(o); partyOpen=true; window.__party=true;
  // hide the page underneath so its animations stop painting while the show runs
  setTimeout(()=>{ if(partyOpen) document.querySelector(".wrap").style.visibility="hidden"; },650);
  try{ navigator.vibrate && navigator.vibrate([30,60,30,60,120]); }catch(e){}
  try{ SFX.stamp(goalHit, !goalHit && !!_ri.mid && count===_ri.mid); }catch(e){}

  let raf=0;
  const dur = goalHit?5200:3800;
  if(!still){
    const c=o.querySelector("canvas.fx"), x=c.getContext("2d"), r=Math.min(devicePixelRatio||1,1.5), W=innerWidth, H=innerHeight, cx=W/2, cy=H*.42;
    c.width=Math.round(W*r); c.height=Math.round(H*r); x.setTransform(r,0,0,r,0,0); x.lineCap="round";
    const cols=["#ff5fa2","#ffb84d","#fff36b","#6bffb0","#5fd8ff","#8b7bff","#ff6ff2","#ffffff"];
    const span=Math.hypot(W,H)*.75;
    const warp=Array.from({length:120},(_,i)=>({a:Math.random()*Math.PI*2, d:Math.random()*40+4, v:Math.random()*.05+.05, c:i%cols.length}));
    const bits=[]; const blast=(n,pow)=>{ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=4+Math.random()*pow;
      bits.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,s:3+Math.random()*6,rot:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length],k:i%3,life:0}); } };
    const meteors=[]; const meteor=()=>{ if(meteors.length<9) meteors.push({x:W*(.2+Math.random()*1.1), y:-30-Math.random()*H*.2, v:10+Math.random()*6, l:70+Math.random()*70, c:cols[Math.floor(Math.random()*7)]}); };
    const starPath=new Path2D(); for(let q=0;q<10;q++){ const rr=q%2?.42:1, aa=q/10*Math.PI*2-Math.PI/2; starPath[q?"lineTo":"moveTo"](Math.cos(aa)*rr,Math.sin(aa)*rr); } starPath.closePath();
    const t0=performance.now(); let blasted=false, second=false, last=t0;
    (function f(t){ const e=t-t0, dt=Math.min(2.5,(t-last)/16.67); last=t; x.setTransform(r,0,0,r,0,0); x.clearRect(0,0,W,H);
      if(e<900){ const k=Math.min(1,e/900); x.globalAlpha=Math.min(1,.35+k);
        for(let ci=0;ci<cols.length;ci++){ x.strokeStyle=cols[ci]; x.lineWidth=1.6+k*1.4; x.beginPath();
          for(const s of warp){ if(s.c!==ci) continue; const d0=s.d; s.d+=s.d*s.v*(1+k*3)*dt; if(s.d>span){ s.d=Math.random()*30+4; continue; }
            const ca=Math.cos(s.a), sa=Math.sin(s.a); x.moveTo(cx+ca*d0,cy+sa*d0); x.lineTo(cx+ca*s.d,cy+sa*s.d); }
          x.stroke(); } }
      if(e>650 && !blasted){ blasted=true; blast(goalHit?150:100, goalHit?14:11); for(let i=0;i<4;i++) meteor(); }
      if(goalHit && e>1500 && !second){ second=true; blast(120,14); for(let i=0;i<4;i++) meteor(); }
      if(e>900 && Math.random()<.05*dt) meteor();
      for(let i=meteors.length-1;i>=0;i--){ const m=meteors[i]; m.x-=m.v*.7*dt; m.y+=m.v*dt; if(m.y>H+60){ meteors.splice(i,1); continue; }
        const tx=m.x+m.l*.7, ty=m.y-m.l;
        x.globalAlpha=.35; x.strokeStyle=m.c; x.lineWidth=5; x.beginPath(); x.moveTo(m.x,m.y); x.lineTo(tx,ty); x.stroke();
        x.globalAlpha=1; x.strokeStyle="#fff"; x.lineWidth=2; x.beginPath(); x.moveTo(m.x,m.y); x.lineTo((m.x+tx)/2,(m.y+ty)/2); x.stroke(); }
      for(const b of bits){ b.vy+=.22*dt; b.vx*=Math.pow(.985,dt); b.x+=b.vx*dt; b.y+=b.vy*dt; b.rot+=b.vr*dt; b.life+=dt;
        const al=1-b.life/150; if(al<=0||b.y>H+20) continue; x.globalAlpha=al; x.fillStyle=b.c;
        const co=Math.cos(b.rot)*b.s, si=Math.sin(b.rot)*b.s; x.setTransform(co*r,si*r,-si*r,co*r,b.x*r,b.y*r);
        if(b.k===0) x.fill(starPath); else if(b.k===1){ x.beginPath(); x.arc(0,0,.45,0,6.28); x.fill(); } else x.fillRect(-.5,-.25,1,.5); }
      x.setTransform(r,0,0,r,0,0); x.globalAlpha=1;
      if(e>800){ const R=big.clientWidth*.64, k=Math.min(1,(e-800)/600);
        orbs.forEach((el,i)=>{ const a=e/900+i*Math.PI*2/orbs.length, z=Math.sin(a), sc=(.62+.28*z)*k;
          el.style.transform=`translate3d(${(Math.cos(a)*R*k).toFixed(1)}px,${(z*R*.3*k).toFixed(1)}px,0) translate(-50%,-50%) scale(${sc.toFixed(3)})`;
          const zi = z>0?"3":"0"; if(el.style.zIndex!==zi) el.style.zIndex=zi; if(el.style.opacity!=="1") el.style.opacity=k>=1?"1":String(k); }); }
      if(e<dur) raf=requestAnimationFrame(f); })(t0);
  }
  let closed=false;
  const close=()=>{ if(closed) return; closed=true; cancelAnimationFrame(raf); partyOpen=false; window.__party=false;
    document.querySelector(".wrap").style.visibility="";
    o.style.transition="opacity .3s"; o.style.opacity="0";
    setTimeout(()=>{ o.remove(); after(); },300); };
  o.onclick=close; setTimeout(close, dur);
}

else { refresh(); if(!me) setTimeout(()=>{ if(!me && !document.getElementById("picker")) openPicker(); },900); setInterval(()=>{ if(document.visibilityState==="visible") refresh(); }, 8000);
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") refresh(); }); }
