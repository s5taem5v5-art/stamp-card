/* ---------- guitar chord chart ---------- */
function earGtrSVG(name){
  const f = EAR_GTR[name]; if(!f) return "";
  const W = 104, H = 124, x0 = 22, dx = 13, y0 = 22, dy = 20, b = EAR_BARRE[name];
  // a shape up the neck is drawn from its lowest fret, with the fret number beside it
  const top = Math.max(...f.filter(v => v != null)), low = Math.min(...f.filter(v => v)), base = top > 4 ? low : 1, sh = base - 1;
  let s = `<svg class="ear-gd" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><rect x="${x0}" y="${y0}" width="${dx * 5}" height="${dy * 4}" fill="none" stroke="currentColor" stroke-width="1.2"/>`;
  if(base === 1) s += `<rect x="${x0 - 1}" y="${y0 - 3}" width="${dx * 5 + 2}" height="4" fill="currentColor"/>`;
  else s += `<text x="${x0 - 6}" y="${y0 + dy * .5 + 4}" text-anchor="end" font-size="10" font-weight="800" fill="currentColor">${base}fr</text>`;
  for(let i = 1; i < 5; i++) s += `<line x1="${x0}" x2="${x0 + dx * 5}" y1="${y0 + i * dy}" y2="${y0 + i * dy}" stroke="currentColor" stroke-width="1"/>`;
  for(let i = 1; i < 5; i++) s += `<line y1="${y0}" y2="${y0 + dy * 4}" x1="${x0 + i * dx}" x2="${x0 + i * dx}" stroke="currentColor" stroke-width="1"/>`;
  if(b) s += `<rect x="${x0 - 4}" y="${y0 + (b - .5) * dy - 6}" width="${dx * 5 + 8}" height="12" rx="6" fill="#ff7aa8"/>`;
  f.forEach((v, i) => { const x = x0 + i * dx;
    if(v == null) s += `<text x="${x}" y="${y0 - 8}" text-anchor="middle" font-size="11" fill="currentColor">×</text>`;
    else if(v === 0) s += `<circle cx="${x}" cy="${y0 - 11}" r="3.6" fill="none" stroke="currentColor" stroke-width="1.4"/>`;
    else if(v !== b) s += `<circle cx="${x}" cy="${y0 + (v - sh - .5) * dy}" r="5.6" fill="#ff7aa8"/>`; });
  return s + `<text x="${x0 + dx * 2.5}" y="${H - 3}" text-anchor="middle" font-size="13" font-weight="900" fill="currentColor">${earChordLabel(name)}</text></svg>`;
}

    } else if(t.startsWith("video/") || /\.(mp4|mov|m4v|webm|3gp)$/.test(nm)){
      const v=el("video"); v.muted=true; v.playsInline=true; v.setAttribute("playsinline",""); v.setAttribute("webkit-playsinline",""); v.preload="auto"; v.controls=true;
      v.src=pvURL+"#t=0.001";
      const dur=el("span","pv-dur");
      v.addEventListener("loadedmetadata",()=>{ if(isFinite(v.duration)){ const d=Math.round(v.duration); dur.textContent=`▶ ${Math.floor(d/60)}:${String(d%60).padStart(2,"0")}`;
        if(d > VID.maxSec){ pk.textContent=`この動画は${Math.floor(d/60)}分${d%60}秒あります。5分までにして撮りなおしてね。`; pk.style.color="#ff8a9a"; sb.disabled=true; }
        else { pk.style.color=""; pk.textContent+=` ・ 送るときに軽くします（${d<60?Math.max(d,1)+"秒":"約"+Math.ceil(d/60)+"分"}くらいかかります）`; } } });
      // grab the first frame as a picture so it shows even before playing (iPhone)
      v.addEventListener("loadeddata",()=>{ try{ const c=document.createElement("canvas"), w=v.videoWidth, h=v.videoHeight; if(!w||!h) return; const sc=Math.min(1,720/Math.max(w,h));
        c.width=Math.round(w*sc); c.height=Math.round(h*sc); c.getContext("2d").drawImage(v,0,0,c.width,c.height); c.toBlob(b=>{ if(b && !v.poster) v.poster=URL.createObjectURL(b); },"image/jpeg",.8); }catch(e){} }, {once:true});
      v.onerror=()=>{ pv.innerHTML=""; pv.append(el("div","pv-ic","🎥 動画（このスマホでは中身を表示できませんが、送れます）")); };
      pv.append(v, dur);
    } else {
      const au=el("audio"); au.controls=true; au.preload="metadata"; au.src=pvURL; pv.classList.add("aud"); pv.append(el("div","pv-ic","🎵 録音"), au);
    }
  }
  f.onsubmit=async e=>{ e.preventDefault(); const file=fi.files[0]; if(!file||Stu.sending) return;
    Stu.sending=a.id; sb.disabled=true; fi.disabled=true; bar.hidden=false; msg.style.color="";
    const ui=(t,p)=>{ msg.textContent=t; bar.firstChild.style.width=Math.round(p*100)+"%"; };
    try{ await submitWork(a, file, f.querySelector(".sub-cmt").value, ui);
      Stu.sending=null; delete Stu.reopen[a.id]; clearPv(); SFX.ping && SFX.ping(); toast("送りました！先生のOKを待ってね"); stuRefresh(true); }
    catch(err){ Stu.sending=null; fi.disabled=false; sb.disabled=false; bar.hidden=true; msg.style.color="#ff8a9a";
      const em=err&&err.message||"";
      msg.textContent = em==="too_big" ? "ファイルが大きすぎます（50MBまで）。短く撮りなおすか、画質を下げて撮ってね。"
        : em==="too_long" ? "動画が長すぎます。5分までにして撮りなおしてね。"
        : em==="bad_type" ? "このファイルは送れません。動画・写真・録音のファイルをえらんでね。"
        : em==="stalled" ? "動画を軽くしている途中で止まりました。この画面を開いたまま、もう一度「先生に送る」を押してね。"
        : em==="full" ? "先生の保存スペースがいっぱいです。先生に知らせてね。"
        : em==="cannot_submit" ? "この課題はもう送れない状態です（先生がOKずみ等）。画面を下に引っぱって更新してね。"
        : em==="bad_key" ? "番号が見つかりません。もう一度ログインしてね。"
        : isNetErr(err) ? "送れませんでした。電波のいいところでもう一度ためしてね。" : "送れませんでした（"+em+"）";
      if(em==="cannot_submit") stuRefresh(true); } };
  return f;
}

/* full-screen viewer that walks through the queue */
function openViewer(list, idx, after){
  if(!list.length) return; let i=Math.max(0,idx), changed=false;
  const o=el("div","sheet viewer"); o.id="viewer";
  const p=el("div","panel vw"); p.setAttribute("role","dialog"); o.append(p);
  const close=()=>{ o.remove(); if(changed) after(); };
  o.onclick=e=>{ if(e.target===o) close(); };
  function draw(){
    if(!list.length){ close(); toast("チェック待ちはぜんぶ終わりました 🎉"); return; }
    if(i>=list.length) i=list.length-1;
    const {a, name}=list[i]; p.innerHTML="";
    const top=el("div","vw-top");
    const pv=el("button","btn small","‹"); pv.disabled=i===0; pv.onclick=()=>{ i--; draw(); };
    const nx=el("button","btn small","›"); nx.disabled=i>=list.length-1; nx.onclick=()=>{ i++; draw(); };
    const x=el("button","btn small","とじる"); x.onclick=close;
    top.append(pv, el("span","vw-n",`${i+1} / ${list.length}`), nx, x); p.append(top);
    const hd=el("div","task-hd"); hd.append(el("b","task-t",name), el("span","rw-note",fmtDate(a.submitted_at)+" 提出")); p.append(hd);
    p.append(el("div","task-meta","📝 "+a.title));
    if(a.comment) p.append(el("div","scmt","生徒：「"+a.comment+"」"));
    const m=mediaEl(a); p.append(m); const mv=m.querySelector("video"); if(mv){ mv.autoplay=true; }
    const cm=el("input","rv-cmt"); cm.maxLength=200; cm.placeholder="ひとこと（なくてもOK）例：リズムがよくなったね！"; p.append(cm);
    const chips=el("div","chips"); ["よくできました！","リズムがよくなったね","もう少しゆっくりひいてみよう","指づかいに気をつけて"].forEach(t=>{ const c=el("button","chip",t); c.type="button"; c.onclick=()=>{ cm.value=t; }; chips.append(c); }); p.append(chips);
    const bt=el("div","big2");
    const ok=el("button","press rv-ok","OK！\nスタンプOK"); ok.style.whiteSpace="pre-line";
    const ng=el("button","btn rv-ng","やり直し\nしてもらう"); ng.style.whiteSpace="pre-line";
    const go=async v=>{ ok.disabled=ng.disabled=true;
      try{ await doReview(a, v, cm.value); changed=true; toast(v?`${name}さんにOK（生徒がスタンプを押せます）`:`${name}さんにやり直しをお願いしました`); list.splice(i,1); draw(); }
      catch(e){ ok.disabled=ng.disabled=false; toast("できませんでした（"+e.message+"）"); } };
    ok.onclick=()=>go(true); ng.onclick=()=>go(false); bt.append(ok,ng); p.append(bt);
    p.scrollTop=0;
  }
  document.body.append(o); draw();
}

/* checkbox list of students; exclude = already assigned */
function pickList(exclude, chosen, only){
  const wrap=el("div","pick-wrap");
  const q=el("input"); q.type="search"; q.placeholder="名前・番号でさがす"; q.className="pk-q";
  const tools=el("div","btns"); const all=el("button","btn small","表示中をぜんぶ選ぶ"); all.type="button"; const none=el("button","btn small","選択をクリア"); none.type="button";
  const info=el("span","rw-note pk-n"); tools.append(all,none,info);
  const list=el("div","pk-list");
  const arr=[...T.students].filter(s=>!only||only(s)).sort(numSort);
  const upd=()=>{ info.textContent=`${chosen.size}人 選択中`; };
  const draw=()=>{ list.innerHTML=""; const qq=q.value.trim().toLowerCase().replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248));
    arr.filter(s=>!qq || s.name.toLowerCase().includes(qq) || String(s.num||"")===qq.replace(/^0+(?=\d)/,"")).forEach(s=>{
      const l=el("label","pk"); const cb=el("input"); cb.type="checkbox"; cb.value=s.id; l.dataset.course=s.course||"";
      if(exclude.has(s.id)){ cb.disabled=true; cb.checked=true; l.classList.add("dis"); } else cb.checked=chosen.has(s.id);
      cb.onchange=()=>{ cb.checked?chosen.add(s.id):chosen.delete(s.id); upd(); };
      l.append(cb, el("span","no",s.num!=null?"No."+s.num:"—"), el("span",null,nmC(s)+(exclude.has(s.id)?"（出し済み）":""))); list.append(l); });
    if(!list.children.length) list.append(el("div","empty","見つかりません")); };
  q.oninput=draw;
  all.onclick=()=>{ list.querySelectorAll("input:not(:disabled)").forEach(cb=>{ cb.checked=true; chosen.add(cb.value); }); upd(); };
  none.onclick=()=>{ chosen.clear(); list.querySelectorAll("input:not(:disabled)").forEach(cb=>cb.checked=false); upd(); };
  wrap.append(q, tools, list); draw(); upd(); return wrap;
}

function openAdd(){

  const close=()=>{ o.remove(); tRender(); };
  o.querySelector("#add-cancel").onclick=close; o.onclick=e=>{ if(e.target===o) close(); };
  o.querySelector("#add-ok").onclick=async()=>{ const am=o.querySelector("#add-msg"); am.style.color="#ff8a9a";

    if(!lines.length){ am.textContent="「番号 名前」を入れてね"; return; }
    if(lines.length>300){ am.textContent="一度に300人までです"; return; }
    const nums=[], names=[], bad=[];
    const norm=x=>{ x=x.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[ー－]/g,"-").toUpperCase(); return /^\d+$/.test(x)?String(+x):x; };
    lines.forEach((l,i)=>{ const m=l.replace(/^No\.?/i,"").match(/^([0-9０-９A-Za-zＡ-Ｚａ-ｚ\-ー－]{1,12})[\s　,、.．:：]+(.+)$/);
      if(!m || !/[0-9０-９]/.test(m[1])){ bad.push(i+1); return; } nums.push(norm(m[1])); names.push(m[2].trim().slice(0,20)); });
    if(bad.length){ am.textContent=`${bad.join("・")}行目に番号がありません。「12 やまだ はなこ」のように書いてね。`; return; }

    try{ const r=await rpc("mc_t_add_n",{tk:TK, p_nums:nums, p_names:names});
      if(r.dups && r.dups.length){ am.textContent=`もう使われている番号です：${r.dups.join("、")}`; return; }
      toast(`${r.added}人 追加しました`); o.remove(); tRefresh(true); }
    catch(e){ am.textContent="追加できませんでした（"+e.message+"）"; } };
  document.body.append(o); setTimeout(()=>{ try{ o.querySelector("textarea").focus(); }catch(e){} },50);
}

  const keep=()=>{ window.__gOpen={key:okey, tab}; };

      try{ const li=(T.students||[]).find(x=>x.id===s.id);
        if(C){ const r=await rpc("mc_t_cgrade",{tk:TK, sid:s.id, p_course:course, p_grade:g}); s.courses=r; if(li) li.courses=r; }
        else { const r=await rpc("mc_t_grade",{tk:TK, sid:s.id, p_grade:g}); s.grade=r.grade; if(r.rank!=null) s.rank=r.rank; if(li){ li.grade=s.grade; li.rank=s.rank; } }
        toast((C?C.ico+C.jp+"：":"")+gLabel(g)+" にしました（"+RANKS[gRank(g)].name+"）"); window.__gEditing=false; tRender(); }
      catch(e){ window.__gEditing=false; toast("保存できませんでした（"+e.message+"）"); } }, ms); };
  const draw=()=>{
    lab.textContent = g==null ? "G未設定" : gLabel(g); sub.textContent = g==null ? "まずランクを選んでね" : RANKS[gRank(g)].name+"（ランクは自動で合います）";

    const open = tab!=null; s2.style.display=grid.style.display=fine.style.display = open ? "" : "none";
    grid.innerHTML=""; if(open){ const [lo,hi]=G_BAND[tab];

const PUSH_FN="https://karlvjvqahtmeovvmffm.supabase.co/functions/v1/mc-push";
const Push={reg:null};
function pushEnv(){ const sup=("serviceWorker" in navigator)&&("PushManager" in window)&&("Notification" in window);
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const sa=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
  return {sup, ios, sa}; }
async function pushReg(){ if(Push.reg) return Push.reg; if(!("serviceWorker" in navigator)) return null;
  try{ await navigator.serviceWorker.register("sw.js"); Push.reg=await navigator.serviceWorker.ready; return Push.reg; }catch(e){ return null; } }
function b64u8(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; const b=atob(s); return Uint8Array.from(b,c=>c.charCodeAt(0)); }
async function pushPub(){ let k=await rpc("mc_push_pub",{}); if(!k){ try{ await fetch(PUSH_FN,{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}); }catch(e){} k=await rpc("mc_push_pub",{}); } return k; }

async function pushOn(){ const reg=await pushReg(); if(!reg) throw new Error("no_sw");
  const perm=await Notification.requestPermission(); if(perm!=="granted") throw new Error("denied");
  let sub=await reg.pushManager.getSubscription();
  if(!sub){ const k=await pushPub(); if(!k) throw new Error("no_key"); sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64u8(k)}); }
  await pushSave(sub); }
async function pushOff(){ const reg=await pushReg(); const sub=reg&&await reg.pushManager.getSubscription();
  if(sub){ try{ await rpc("mc_push_off",{p_endpoint:sub.endpoint}); }catch(e){} try{ await sub.unsubscribe(); }catch(e){} } lsSet("mc_push_on_"+MODE,""); }
async function pushSync(){ try{ const e=pushEnv(); if(!e.sup || Notification.permission!=="granted" || !lsGet("mc_push_on_"+MODE)) return;
  const reg=await pushReg(); const sub=reg&&await reg.pushManager.getSubscription(); if(sub) await pushSave(sub); }catch(e){} }

function guideIOS(forT){ const d=el("div","pc-guide"); d.innerHTML=`<p class="rw-note">iPhoneで通知を受け取るには、まずこのページを<b>ホーム画面に追加</b>してね。</p>
  <ol><li>画面下の<b>共有ボタン</b>（四角から↑が出ているマーク）を押す</li><li><b>「ホーム画面に追加」</b>を押す</li>
  <li>ホーム画面にできた<b>「${forT?"NACHA":"おんがくスタンプ"}」</b>のアイコンから開く</li><li>${forT?"パスワードを入れて入り":"番号を入れて入り"}、もう一度ここの<b>「🔔 通知をオンにする」</b>を押す</li></ol>`; return d; }
function pushBoot(){
  if(!("serviceWorker" in navigator) || location.protocol!=="https:") return;
  pushReg().then(()=>pushSync());
  try{ if(navigator.clearAppBadge) navigator.clearAppBadge(); }catch(e){}
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ try{ if(navigator.clearAppBadge) navigator.clearAppBadge(); }catch(e){} } });
  navigator.serviceWorker.addEventListener("message",ev=>{ if(ev.data&&ev.data.t==="refresh"){ if(MODE==="s"&&SK) stuRefresh(); else if(MODE==="t") tRefresh(); } });
}

/* ================= boot ================= */
document.getElementById("today").textContent = (()=>{const d=new Date();return `今日は ${d.getMonth()+1}月${d.getDate()}日（${"日月火水木金土"[d.getDay()]}）`})();
setTimeout(()=>{ try{ prerenderStamps(); prerenderWheels(); }catch(e){} },400);
if(MODE==="s"){
  soundButtons(document.getElementById("bar"));
  if(SK) stuStart(); else stuLogin();
  document.addEventListener("visibilitychange",()=>{ if(SK && document.visibilityState==="visible") stuRefresh(); });
} else if(MODE==="t"){
  soundButtons(document.getElementById("bar"));
  tRender(); tRefresh(true); setTimeout(tCleanup, 3000);
  setInterval(()=>{ if(document.visibilityState==="visible" && !window.__party){ if(T.sel) tLoadStudent(); else if(T.task) tLoadTask(); tRefresh(); } }, 20000);
} else tLock();
if(MODE==="s"||MODE==="t") pushBoot();
function tLock(msg){
  const app=document.getElementById("app"); app.innerHTML=""; document.getElementById("note").textContent="";
  const box=el("section","card login"); box.id="t-lock";
  box.innerHTML=`<div class="lock-ico">🔒</div><h2>先生用ページ</h2><p class="rw-note">先生の<b>パスワード</b>を入れてください</p>
    <form id="pass-form"><input id="pass-in" type="password" autocomplete="current-password" placeholder="パスワード"><button type="submit" class="press" id="pass-btn">入る</button></form><p class="rw-note" id="lock-msg"></p>
    <details class="lock-alt"><summary>先生用リンクで入る</summary><form id="lock-form"><input id="lock-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="先生用リンクを貼り付け"><button type="submit" class="btn small" id="lock-btn">リンクで入る</button></form></details>`;
  const out=box.querySelector("#lock-msg"); if(msg) out.textContent=msg;
  const enter=k=>{ lsSet("mc_tk",k); location.replace(location.pathname); };
  box.querySelector("#pass-form").onsubmit=async e=>{ e.preventDefault(); const pw=box.querySelector("#pass-in").value; if(!pw){ box.querySelector("#pass-in").focus(); return; }
    out.textContent="確認中…";
    try{ const r=await rpc("mc_t_login",{p_pass:pw});
      if(r.ok && okKey(r.tk)) return enter(r.tk);
      box.querySelector("#pass-in").value="";
      out.textContent = r.err==="no_pass" ? "まだパスワードが決まっていません。先生用リンクで1回入って、「生徒」タブの下で決めてください。"
        : r.err==="locked" ? `まちがいが続いたので、${Math.ceil((r.wait||300)/60)}分ほど待ってからもう一度どうぞ。`
        : `パスワードがちがいます${r.left!=null?`（あと${r.left}回）`:""}`; }
    catch(err){ out.textContent="つながりません。電波のいいところでもう一度。"; } };
  box.querySelector("#lock-form").onsubmit=async e=>{ e.preventDefault(); const raw=box.querySelector("#lock-in").value.trim();
    const m=raw.match(/[#&?]t=([A-Za-z0-9_-]{20,})/); const k=m?m[1]:raw;
    if(!okKey(k)){ out.textContent="先生用リンクではないみたいです。"; return; }
    out.textContent="確認中…";
    try{ await rpc("mc_t_state",{tk:k}); enter(k); }
    catch(err){ out.textContent = err.message==="bad_key" ? "先生用リンクがちがいます。" : "つながりません。電波のいいところでもう一度。"; } };
  app.append(box); setTimeout(()=>{ try{ box.querySelector("#pass-in").focus(); }catch(e){} },300);
}
