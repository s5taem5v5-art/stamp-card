/* teacher: class grade — step 1: tap a rank, step 2: its G list appears, tap one (saves right away) */
function gStepper(s){
  const box=el("section","card gstep"); box.id="g-step";
  let g = gOk(s.grade) ? s.grade|0 : null, tab = (window.__gOpen&&window.__gOpen.sid===s.id) ? window.__gOpen.tab : null, timer=null;
  const keep=()=>{ window.__gOpen={sid:s.id, tab}; };
  const head=el("div","gtop2"), lab=el("b","glab"), sub=el("small","gsub"); const hm=el("div","gmid"); hm.append(el("span","gk2","クラス"), lab, sub); head.append(hm);
  const s1=el("p","gstep-t","① ランクを選ぶ"), tabs=el("div","gtabs"), s2=el("p","gstep-t","② Gを選ぶ"), grid=el("div","ggrid"), fine=el("div","gfine");
  const minus=el("button","btn small","−1段"), plus=el("button","btn small","＋1段"); minus.id="g-minus"; plus.id="g-plus"; minus.type=plus.type="button";
  fine.append(minus, plus);
  const save=(ms)=>{ clearTimeout(timer); window.__gEditing=true; timer=setTimeout(async()=>{
      try{ const r=await rpc("mc_t_grade",{tk:TK, sid:s.id, p_grade:g}); s.grade=r.grade; if(r.rank!=null) s.rank=r.rank;
        const li=(T.students||[]).find(x=>x.id===s.id); if(li){ li.grade=s.grade; li.rank=s.rank; }
        toast(gLabel(g)+" にしました（"+RANKS[gRank(g)].name+"）"); window.__gEditing=false; tRender(); }
      catch(e){ window.__gEditing=false; toast("保存できませんでした（"+e.message+"）"); } }, ms); };
  const draw=()=>{
    lab.textContent = g==null ? "G未設定" : gLabel(g); sub.textContent = g==null ? "まずランクを選んでね" : RANKS[gRank(g)].name+"（ランクは自動で合います）";
    tabs.innerHTML=""; RANKS.forEach((R,i)=>{ const t=el("button","gtab rk"+i+(i===tab?" on":"")+(g!=null&&gRank(g)===i?" cur":"")); t.type="button"; t.dataset.r=i;
      t.append(el("b",null,R.name), el("small",null,"G"+gParts(G_BAND[i][0])[0]+"〜"+gParts(G_BAND[i][1])[0])); t.onclick=()=>{ tab = tab===i ? null : i; keep(); draw(); }; tabs.append(t); });
    const open = tab!=null; s2.style.display=grid.style.display=fine.style.display = open ? "" : "none";
    grid.innerHTML=""; if(open){ const [lo,hi]=G_BAND[tab];
      for(let i=lo;i<=hi;i++){ const c=el("button","gcell"+(i===g?" on":""),gLabel(i).slice(1)); c.type="button"; c.dataset.g=i; c.onclick=()=>{ g=i; keep(); draw(); save(250); }; grid.append(c); } }
    minus.disabled = g==null || g<=0; plus.disabled = g==null || g>=G_MAX; };
  minus.onclick=()=>{ if(g==null||g<=0) return; g--; tab=gRank(g); keep(); draw(); save(800); };
  plus.onclick=()=>{ if(g==null||g>=G_MAX) return; g++; tab=gRank(g); keep(); draw(); save(800); };
  box.append(head, s1, tabs, s2, grid, fine); draw(); return box;
}

  const send=async(val)=>{ try{ const r=await rpc("mc_t_msg",{tk:TK, sid:s.id, p_msg:val}); s.t_msg=r.t_msg; s.t_msg_at=r.t_msg_at; if(!r.t_msg) ta.value="";
      toast(r.t_msg?"メッセージを保存しました（生徒のカードの裏に出ます）":"メッセージを消しました"); ta.blur(); tRender(); }
    catch(e){ toast(e.message==="too_long"?"300文字までです":"保存できませんでした（"+e.message+"）"); } };
  sv.onclick=()=>send(ta.value); del.onclick=()=>{ if(!del.dataset.ok){ del.dataset.ok=1; del.textContent="消す？"; return; } send(""); };
  row.append(cnt, del, sv);
  if(s.t_msg_at){ const d=new Date(s.t_msg_at); box.append(el("p","rw-note",`最後に書いた日：${d.getMonth()+1}月${d.getDate()}日 ・ カード右下の「💌」で裏が見られます`)); }
  box.append(ta, row); return box;
}

/* ================= boot ================= */
document.getElementById("today").textContent = (()=>{const d=new Date();return `今日は ${d.getMonth()+1}月${d.getDate()}日（${"日月火水木金土"[d.getDay()]}）`})();
setTimeout(()=>{ try{ prerenderStamps(); prerenderWheels(); }catch(e){} },400);
if(MODE==="s"){
  soundButtons(document.getElementById("bar"));
  if(SK) stuStart(); else stuLogin();
  document.addEventListener("visibilitychange",()=>{ if(SK && document.visibilityState==="visible") stuRefresh(); });
} else if(MODE==="t"){
  soundButtons(document.getElementById("bar"));
  tRender(); tRefresh(true); setTimeout(tCleanup, 3000);
  setInterval(()=>{ if(document.visibilityState==="visible" && !window.__party){ if(T.sel) tLoadStudent(); else if(T.task) tLoadTask(); tRefresh(); } }, 20000);
} else tLock();
function tLock(msg){
  const app=document.getElementById("app"); app.innerHTML=""; document.getElementById("note").textContent="";
  const box=el("section","card login"); box.id="t-lock";
  box.innerHTML=`<div class="lock-ico">🔒</div><h2>先生用ページ</h2><p class="rw-note">最初の1回だけ、<b>先生用リンク</b>をここに貼り付けてください。<br>次からはこのページを開くだけで入れます。</p>
    <form id="lock-form"><input id="lock-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="先生用リンクを貼り付け"><button type="submit" class="press" id="lock-btn">入る</button></form><p class="rw-note" id="lock-msg"></p>`;
  if(msg) box.querySelector("#lock-msg").textContent=msg;
  box.querySelector("form").onsubmit=async e=>{ e.preventDefault(); const raw=box.querySelector("#lock-in").value.trim();
    const m=raw.match(/[#&?]t=([A-Za-z0-9_-]{20,})/); const k=m?m[1]:raw; const out=box.querySelector("#lock-msg");
    if(!okKey(k)){ out.textContent="先生用リンクではないみたいです。"; return; }
    out.textContent="確認中…";
    try{ await rpc("mc_t_state",{tk:k}); lsSet("mc_tk",k); location.replace(location.pathname); }
    catch(err){ out.textContent = err.message==="bad_key" ? "先生用リンクがちがいます。" : "つながりません。電波のいいところでもう一度。"; } };
  app.append(box);
}
