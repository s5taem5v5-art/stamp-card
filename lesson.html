  const arr=[...T.students].sort(numSort);
  const upd=()=>{ info.textContent=`${chosen.size}人 選択中`; };
  const draw=()=>{ list.innerHTML=""; const qq=q.value.trim().toLowerCase().replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248));
    arr.filter(s=>!qq || s.name.toLowerCase().includes(qq) || String(s.num||"")===qq.replace(/^0+(?=\d)/,"")).forEach(s=>{
      const l=el("label","pk"); const cb=el("input"); cb.type="checkbox"; cb.value=s.id;
      if(exclude.has(s.id)){ cb.disabled=true; cb.checked=true; l.classList.add("dis"); } else cb.checked=chosen.has(s.id);
      cb.onchange=()=>{ cb.checked?chosen.add(s.id):chosen.delete(s.id); upd(); };
      l.append(cb, el("span","no",s.num!=null?"No."+s.num:"—"), el("span",null,s.name+(exclude.has(s.id)?"（出し済み）":""))); list.append(l); });
    if(!list.children.length) list.append(el("div","empty","見つかりません")); };
  q.oninput=draw;
  all.onclick=()=>{ list.querySelectorAll("input:not(:disabled)").forEach(cb=>{ cb.checked=true; chosen.add(cb.value); }); upd(); };
  none.onclick=()=>{ chosen.clear(); list.querySelectorAll("input:not(:disabled)").forEach(cb=>cb.checked=false); upd(); };
  wrap.append(q, tools, list); draw(); upd(); return wrap;
}
function openPicker(exclude, onOk){
  const chosen=new Set(); const o=el("div","sheet"); o.id="pick-sheet";
  const p=el("div","panel"); p.setAttribute("role","dialog"); p.append(el("b",null,"だれに出す？"), pickList(exclude, chosen));
  const msg=el("p","rw-note"); const ac=el("div","actions"); const c=el("button",null,"やめる"); c.type="button"; const ok=el("button","save","出す"); ok.type="button"; ok.id="pick-ok"; ac.append(c,ok); p.append(msg,ac);
  const close=()=>{ o.remove(); tRender(); };
  c.onclick=close; o.onclick=e=>{ if(e.target===o) close(); };
  ok.onclick=async()=>{ if(!chosen.size){ msg.textContent="生徒をえらんでね"; return; } ok.disabled=true; try{ await onOk([...chosen]); o.remove(); }catch(e){ ok.disabled=false; msg.textContent="できませんでした（"+e.message+"）"; } };
  o.append(p); document.body.append(o);
}
function openTask(presetSid){
  const o=el("div","sheet"); o.id="task-sheet"; const chosen=new Set(presetSid?[presetSid]:[]);
  const p=el("div","panel"); p.setAttribute("role","dialog"); p.setAttribute("aria-label","課題を出す");
  p.innerHTML=`<b>課題を出す</b>
    <label>課題の名前<input id="t-title" maxlength="60" placeholder="例：ブルグミュラー25番 アラベスク"></label>
    <label>くわしく（なくてもOK）<textarea id="t-detail" maxlength="400" style="min-height:80px" placeholder="例：右手だけで3回ひいた動画を送ってね"></textarea></label>
    <label>しめきり（なくてもOK）<input id="t-due" type="date"></label>
    <div class="fl">だれに出す？<div class="seg small" id="t-who"><button type="button" data-w="all">全員</button><button type="button" data-w="pick">えらぶ</button></div></div>
    <div id="t-pick"></div><p class="rw-note" id="t-msg"></p>
    <div class="actions"><button type="button" id="t-cancel">やめる</button><button type="button" class="save" id="t-ok">出す</button></div>`;
  let who=presetSid?"pick":"all";
  const pk=p.querySelector("#t-pick"), wb=p.querySelectorAll("#t-who button");
  const setWho=w=>{ who=w; wb.forEach(b=>b.setAttribute("aria-selected",b.dataset.w===w)); pk.innerHTML="";
    if(w==="pick") pk.append(pickList(new Set(), chosen)); else pk.append(el("p","rw-note",`生徒 ${T.students.length}人 全員に出します`)); };
  wb.forEach(b=>b.onclick=()=>setWho(b.dataset.w)); setWho(who);
  const close=()=>{ o.remove(); tRender(); };
  p.querySelector("#t-cancel").onclick=close; o.onclick=e=>{ if(e.target===o) close(); };
  p.querySelector("#t-ok").onclick=async()=>{ const m=p.querySelector("#t-msg"); m.style.color="#ff8a9a";
    const title=p.querySelector("#t-title").value.trim(); if(!title){ m.textContent="課題の名前を入れてね"; return; }
    const sids= who==="all" ? T.students.map(s=>s.id) : [...chosen]; if(!sids.length){ m.textContent="生徒をえらんでね"; return; }
    const okb=p.querySelector("#t-ok"); okb.disabled=true;
    try{ const r=await rpc("mc_t_task_create",{tk:TK, p_title:title, p_detail:p.querySelector("#t-detail").value, p_due:p.querySelector("#t-due").value||null, p_sids:sids});
      o.remove(); toast(`「${title}」を ${r.n}人に出しました`); await tRefresh(true); if(T.sel) tLoadStudent(); }
    catch(e){ okb.disabled=false; m.textContent="出せませんでした（"+e.message+"）"; } };
  o.append(p); document.body.append(o); setTimeout(()=>{ try{ p.querySelector("#t-title").focus(); }catch(e){} },50);
}
/* ---- students ---- */
function stuCount(s){ const r=roundInfo({goal:s.goal_p, stamps:{length:(s.np|0)+(s.ne|0)}}); return `${r.inRound}/${r.goal}`+(r.done?`<br>${r.done}回達成`:""); }
function tStudents(app){
  const tools=el("div","tools");
  const q=el("input"); q.id="q"; q.type="search"; q.placeholder="名前・番号でさがす"; q.value=T.q; q.oninput=()=>{ T.q=q.value; drawList(); };
  const add=el("button","btn primary","＋ 生徒を追加"); add.id="add-btn"; add.onclick=openAdd;
  tools.append(q,add); app.append(tools);
  const stats=el("div","stats"); stats.innerHTML=`<span>生徒 ${T.students.length}人</span>`;
  const so=el("select"); so.id="sort"; so.innerHTML=`<option value="num">番号順</option><option value="name">名前順</option><option value="recent">最近スタンプ順</option><option value="few">スタンプ少ない順</option>`; so.value=T.sort;
  so.onchange=()=>{ T.sort=so.value; lsSet("mc_sort",T.sort); drawList(); }; stats.append(so); app.append(stats);
  const list=el("div","list"); list.id="list"; app.append(list);
  function drawList(){
    list.innerHTML="";
    const qq=T.q.trim().toLowerCase().replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248));
    let arr=T.students.filter(s=>!qq || s.name.toLowerCase().includes(qq) || String(s.num||"")===qq.replace(/^0+(?=\d)/,""));
    if(T.sort==="num") arr.sort(numSort);
    else if(T.sort==="name") arr.sort((a,b)=>a.name.localeCompare(b.name,"ja"));
    else if(T.sort==="recent") arr.sort((a,b)=>String(b.last||"").localeCompare(String(a.last||"")));
    else arr.sort((a,b)=>(a.np+a.ne)-(b.np+b.ne));
    if(!T.students.length){ list.append(el("div","empty","まだ生徒がいません。「＋ 生徒を追加」から登録してね。")); return; }
    if(!arr.length){ list.append(el("div","empty","見つかりません")); return; }
    const subSet=new Set(T.review.map(a=>a.sid));
    arr.forEach(s=>{ const r=el("button","srow"); r.dataset.id=s.id; r.innerHTML=stampSVG(okStamp(s.stamp_p));
      const nb=el("span","no",s.num!=null?"No."+s.num:"番号なし"); if(s.num==null) nb.classList.add("none"); r.append(nb);
      r.append(el("span","nm",s.name), el("span","rkc rk"+rankOf(s.rank), RANKS[rankOf(s.rank)].name)); if(subSet.has(s.id)) r.append(el("span","td","提出あり"));
      const c=el("span","ct"); c.innerHTML=stuCount(s); r.append(c);
      r.onclick=()=>{ T.sel=s.id; T.detail=null; T.sAssign=[]; T.confirmDel=null; T.confirmStu=false; T.ym=nowYM(); tRender(); tLoadStudent(); scrollTo(0,0); };
      list.append(r); });
  }
  drawList();
  const gl=el("details","sec"); gl.id="groupsec"; gl.innerHTML="<summary>グループLINE用のリンク</summary>"; if(T.qr) gl.open=true;
  const msg=`🎵おんがくスタンプ🎵\n下のリンクを開いて、カードに書いてある番号を入れてね！\n${SHARED_URL}`;
  gl.append(el("p","rw-note","このリンクを生徒みんなに送ってOK。開くと番号を聞かれて、入れた番号の子のカードが開きます。"), el("div","linkbox",msg));
  const gb=el("div","btns");
  const gc=el("button","btn small","文章ごとコピー"); gc.id="copy-group"; gc.onclick=async()=>toast(await copyText(msg)?"コピーしました。LINEに貼ってね":"コピーできませんでした"); gb.append(gc);
  if(navigator.share){ const gs=el("button","btn small","LINEなどで送る"); gs.onclick=()=>navigator.share({text:msg}).catch(()=>{}); gb.append(gs); }
  const gq=el("button","btn small",T.qr?"QRをとじる":"QRコード"); gq.id="qr-btn"; gq.onclick=()=>{ T.qr=!T.qr; tRender(); }; gb.append(gq);
  gl.append(gb);
  if(T.qr){ const q=el("div","qr"); try{ const qr=qrcode(0,"M"); qr.addData(SHARED_URL); qr.make(); q.innerHTML=qr.createSvgTag({cellSize:4, margin:2, scalable:true}); }catch(e){ q.textContent="QRコードを作れませんでした"; q.style.color="#000"; } gl.append(q); }
  app.append(gl);
}
function openAdd(){
  const o=el("div","sheet"); o.id="add-sheet";
  o.innerHTML=`<div class="panel" role="dialog" aria-label="生徒を追加"><b>生徒を追加</b><p>1行に1人ずつ「番号 名前」の順で書いてね。まとめて何人でも入れられます。</p>
    <textarea id="add-names" placeholder="1 やまだ はなこ&#10;2 すずき たろう&#10;15 さとう みく"></textarea><p class="rw-note" id="add-msg"></p><div class="actions"><button type="button" id="add-cancel">やめる</button><button type="button" class="save" id="add-ok">追加する</button></div></div>`;
  const close=()=>{ o.remove(); tRender(); };
  o.querySelector("#add-cancel").onclick=close; o.onclick=e=>{ if(e.target===o) close(); };
  o.querySelector("#add-ok").onclick=async()=>{ const am=o.querySelector("#add-msg"); am.style.color="#ff8a9a";
    const lines=o.querySelector("#add-names").value.split(/\n/).map(s=>s.trim()).filter(Boolean);
    if(!lines.length){ am.textContent="「番号 名前」を入れてね"; return; }
    if(lines.length>300){ am.textContent="一度に300人までです"; return; }
    const nums=[], names=[], bad=[];
    const norm=x=>{ x=x.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[ー－]/g,"-").toUpperCase(); return /^\d+$/.test(x)?String(+x):x; };
    lines.forEach((l,i)=>{ const m=l.replace(/^No\.?/i,"").match(/^([0-9０-９A-Za-zＡ-Ｚａ-ｚ\-ー－]{1,12})[\s　,、.．:：]+(.+)$/);
      if(!m || !/[0-9０-９]/.test(m[1])){ bad.push(i+1); return; } nums.push(norm(m[1])); names.push(m[2].trim().slice(0,20)); });
    if(bad.length){ am.textContent=`${bad.join("・")}行目に番号がありません。「12 やまだ はなこ」のように書いてね。`; return; }
    const seen={}; nums.forEach(n=>seen[n]=(seen[n]||0)+1); const dupIn=Object.keys(seen).filter(n=>seen[n]>1);
    if(dupIn.length){ am.textContent=`番号がかぶっています：${dupIn.join("、")}`; return; }
    const exist=nums.filter(n=>T.students.some(s=>s.num===n));
    if(exist.length){ am.textContent=`もう使われている番号です：${exist.join("、")}`; return; }
    try{ const r=await rpc("mc_t_add_n",{tk:TK, p_nums:nums, p_names:names});
      if(r.dups && r.dups.length){ am.textContent=`もう使われている番号です：${r.dups.join("、")}`; return; }
      toast(`${r.added}人 追加しました`); o.remove(); tRefresh(true); }
    catch(e){ am.textContent="追加できませんでした（"+e.message+"）"; } };
  document.body.append(o); setTimeout(()=>{ try{ o.querySelector("textarea").focus(); }catch(e){} },50);
}
function tStudent(app){
  const s=(T.detail&&T.detail.student) || T.students.find(x=>x.id===T.sel);
  const back=el("button","btn small back","‹ 生徒一覧へ"); back.id="back"; back.onclick=()=>{ T.sel=null; T.detail=null; tRender(); tRefresh(); }; app.append(back);
  if(!s){ app.append(el("div","empty","読み込み中…")); return; }
  const stamps=(T.detail&&T.detail.stamps)||[];
  app.append(profileEl(s, profileStats(s, stamps, T.sAssign)));
  const box=el("section","card"); box.style.setProperty("--pc",`var(${COLORS[(s.color|0)%4]})`);
  const who=el("div","who"); const hh=el("h2",null,s.name); if(s.num!=null) hh.prepend(el("span","no big","No."+s.num+" "));
  who.append(hh); box.append(who);
  if(s.num==null) box.append(el("p","rw-note","⚠ 番号が未登録なので、この生徒はログインできません。下の「設定」で番号を入れてね。"));
  const card=cardAll(s, stamps);
  if(T.detail) box.append(progressEl(card)); box.append(rewardEl(card,true));
  app.append(box);
  // assignments of this student
  const as=el("section","card tasks"); as.id="stu-tasks"; as.append(el("h3","sech","📝 この生徒の課題"));
  const qa=el("button","btn small","＋ この生徒だけに課題を出す"); qa.id="stu-task"; qa.onclick=()=>openTask(s.id); as.append(qa);
  if(T.detail && !T.sAssign.length) as.append(el("div","empty","まだ課題がありません"));
  T.sAssign.forEach(a=>{
    if(a.status==="submitted"){ as.append(reviewCard(a, s.name, ()=>{ tLoadStudent(); tRefresh(); })); return; }
    const r=el("div","srow static"); const nm=el("span","nm"); nm.append(el("b",null,a.title)); if(a.t_comment) nm.append(el("small",null,"先生：「"+a.t_comment+"」"));
    r.append(nm, badge(T_STATUS,a.status));
    if(a.status!=="stamped"){ const x=el("button","btn small","はずす"); x.onclick=async()=>{ if(!x.dataset.ok){ x.dataset.ok=1; x.textContent="はずす？"; return; }
      try{ await rpc("mc_t_unassign",{tk:TK, p_assign:a.id}); toast("はずしました"); tLoadStudent(); tRefresh(); }catch(e){ toast("できませんでした（"+e.message+"）"); } }; r.append(x); }
    as.append(r); });
  app.append(as);
  // stamp history
  if(T.detail){ const hs=el("section","card"); hs.append(el("h3","sech","スタンプの記録"));
    const ym=T.ym; hs.append(monthNav(ym, firstYMof(card), d=>{ T.ym=addMonth(T.ym,d); tRender(); }));
    const ul=el("ul","hist"); const inMonth=stamps.filter(x=>x.day.startsWith(ymKey(ym.y,ym.m)+"-")).reverse();
    if(!inMonth.length) ul.append(el("li","empty","この月のスタンプはまだありません"));
    inMonth.forEach(x=>{ const li=el("li","hrow"); li.innerHTML=stampSVG(card.stamp);
      const n=el("span","hn",x.note||"スタンプ"); li.append(n, el("time",null,md(x.day)));
      if(T.confirmDel===x.id){ const y=el("button","btn small warn","取り消す"); y.id="del-yes"; y.onclick=()=>tUnstamp(x.id); const no=el("button","btn small","やめる"); no.onclick=()=>{ T.confirmDel=null; tRender(); }; li.append(y,no); }
      else { const d=el("button","btn small","取消"); d.dataset.del=x.id; d.onclick=()=>{ T.confirmDel=x.id; tRender(); }; li.append(d); }
      ul.append(li); });
    hs.append(ul); app.append(hs); }
  // settings
  const st=el("details","sec"); st.id="settings"; st.innerHTML="<summary>設定（番号・名前・ランク・ごほうび）</summary>";
  const f=el("form"); f.innerHTML=`<div class="row2 r12"><label>番号<input id="s-num" maxlength="12" inputmode="numeric"></label><label>名前<input id="s-name" maxlength="20"></label></div>
    <label>ランク<select id="s-rank">${RANKS.map((x,i)=>`<option value="${i}">${x.name}（${x.jp}）</option>`).join("")}</select></label>
    <label>ごほうびまでのスタンプ数<input id="s-gp" type="number" inputmode="numeric" min="1" max="500" step="1"></label>
    <label>ごほうび<input id="s-rp" maxlength="40" placeholder="例：シールを1まい"></label>
    <label class="toggle"><input type="checkbox" id="s-mid"> 中間ごほうびをつける<small id="s-midn"></small></label>
    <label id="s-rm-l">中間ごほうび<input id="s-rm" maxlength="40" placeholder="例：シールを1まい"></label>
    <div class="actions"><button type="submit" class="save" id="s-save">保存</button></div>`;
  f.querySelector("#s-gp").value=String(s.goal_p); f.querySelector("#s-rank").value=String(rankOf(s.rank));
  const mc=f.querySelector("#s-mid"), rmL=f.querySelector("#s-rm-l"), gpI=f.querySelector("#s-gp"), mn=f.querySelector("#s-midn");
  mc.checked=!!s.mid_on; f.querySelector("#s-rm").value=s.reward_m||"";
  const midUI=()=>{ rmL.hidden=!mc.checked; const g=+gpI.value|0; mn.textContent = mc.checked ? (g>=2?`（${Math.ceil(g/2)}こ目でもらえます）`:"（スタンプ数が2以上のときだけ）") : ""; };
  mc.onchange=midUI; gpI.oninput=midUI; midUI();
  f.querySelector("#s-num").value=s.num??""; f.querySelector("#s-name").value=s.name; f.querySelector("#s-rp").value=s.reward_p||"";
  f.onsubmit=async e=>{ e.preventDefault();
    const g=+String(f.querySelector("#s-gp").value).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248));
    if(!Number.isInteger(g) || g<1 || g>500){ toast("スタンプ数は1〜500の数字で入れてね"); return; }
    try{ const r=await rpc("mc_t_update2",{tk:TK, sid:s.id, p_num:f.querySelector("#s-num").value, p_name:f.querySelector("#s-name").value, p_goal_p:g, p_goal_e:s.goal_e|0||5,
      p_reward_p:f.querySelector("#s-rp").value, p_reward_e:s.reward_e||""});
      if(r==="dup_num"){ toast("その番号はほかの生徒が使っています"); return; }
      await rpc("mc_t_mid",{tk:TK, sid:s.id, p_on:mc.checked, p_reward:f.querySelector("#s-rm").value});
      const nr=+f.querySelector("#s-rank").value; if(nr!==rankOf(s.rank)) await rpc("mc_t_rank",{tk:TK, sid:s.id, p_rank:nr});
      toast("保存しました"); st.open=false; await tLoadStudent(); tRender(); tRefresh(); }
    catch(err){ toast("保存できませんでした（"+err.message+"）"); } };
  st.append(f); app.append(st);
  const dz=el("div","sec");
  if(!T.confirmStu){ const d=el("button","danger","この生徒を削除する"); d.id="del-stu"; d.onclick=()=>{ T.confirmStu=true; tRender(); }; dz.append(d); }
  else { const c=el("div","confirm"); c.append(el("span",null,`${s.name}さんとスタンプ・課題の記録を全部消します。いいですか？`));
    const y=el("button","yes","消す"); y.id="del-stu-yes"; y.onclick=async()=>{ try{ await rpc("mc_t_delete",{tk:TK, sid:s.id}); toast("削除しました"); T.sel=null; T.detail=null; T.confirmStu=false; tRefresh(true); }catch(e){ toast("削除できませんでした（"+e.message+"）"); } };
    const n=el("button",null,"やめる"); n.onclick=()=>{ T.confirmStu=false; tRender(); }; c.append(y,n); dz.append(c); }
  app.append(dz);
}
async function tUnstamp(id){
  try{ await rpc("mc_t_unstamp",{tk:TK, stamp_id:id}); T.confirmDel=null; T.detail.stamps=T.detail.stamps.filter(x=>x.id!==id); toast("取り消しました"); tRender(); tRefresh(); }
  catch(e){ toast("取り消せませんでした（"+e.message+"）"); }
}
/* files of work reviewed 30+ days ago are removed whenever the teacher page opens */
async function tCleanup(){
  try{ const files=await rpc("mc_expired_files",{}); if(!files || !files.length) return;
    await fetch(SB_URL+"/storage/v1/object/mc-submissions",{method:"DELETE", headers:{apikey:SB_KEY,"Content-Type":"application/json"}, body:JSON.stringify({prefixes:files})});
    await rpc("mc_mark_deleted",{p_paths:files});
  }catch(e){}
}

document.getElementById("today").textContent = (()=>{const d=new Date();return `今日は ${d.getMonth()+1}月${d.getDate()}日（${"日月火水木金土"[d.getDay()]}）`})();
